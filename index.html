<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudySpot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    text-align: center;
    padding: 35px 15px;
}

.logo {
    font-size: 38px;
    font-weight: bold;
}

.tagline {
    font-size: 16px;
    margin-top: 10px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px 15px;
}

.search-box {
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.search-box h2 {
    text-align: center;
    margin-top: 0;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 12px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 8px;
}

.nearby {
    background: #2563eb;
    color: white;
}

.radius-title {
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

.radius-buttons {
    display: flex;
    gap: 8px;
}

.radius-button {
    flex: 1;
    background: #eef2ff;
    color: #3730a3;
    border: 2px solid transparent;
}

.radius-button.active {
    background: #2563eb;
    color: white;
}

.anywhere {
    background: #111827;
    color: white;
    margin-top: 15px;
}

.location-box {
    display: none;
    background: #ecfdf5;
    color: #065f46;
    padding: 15px;
    margin-top: 15px;
    border-radius: 12px;
    font-size: 14px;
}

.result-message {
    margin-top: 15px;
    padding: 14px;
    background: #eff6ff;
    color: #1e40af;
    border-radius: 12px;
    display: none;
}

.section-title {
    margin-top: 30px;
}

.library-card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

.library-name {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 12px;
}

.info {
    margin: 8px 0;
}

.tag {
    display: inline-block;
    padding: 7px 11px;
    margin: 4px 3px 0 0;
    border-radius: 20px;
    background: #e8efff;
    color: #2563eb;
    font-size: 13px;
}

.details {
    background: #111827;
    color: white;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
    
</head>

<body>

<header>
    <div class="logo">📚 StudySpot</div>
    <div class="tagline">Find the perfect study library near you</div>
</header>

<div class="container">

    <div class="search-box">

        <h2>🔎 Find Your Study Space</h2>

        <input
            id="searchInput"
            type="text"
            placeholder="Search library or location..."
        >

        <button class="nearby" onclick="findNearby()">
            📍 Find Libraries Near Me
        </button>

        <div class="radius-title">
            Search distance:
        </div>

        <div class="radius-buttons">

            <button
                class="radius-button active"
                id="radius5"
                onclick="selectRadius(5)">
                5 km
            </button>

            <button
                class="radius-button"
                id="radius10"
                onclick="selectRadius(10)">
                10 km
            </button>

            <button
                class="radius-button"
                id="radius15"
                onclick="selectRadius(15)">
                15 km
            </button>

        </div>

        <button class="anywhere" onclick="searchAnywhere()">
            🌍 Search Anywhere
        </button>

        <a href="owner.html" style="text-decoration:none;">
    <button style="background:#16a34a;color:white;">
        🏫 Register Your Library
    </button>
        </a>

<a href="owner-login.html" style="text-decoration: none;">
  <button style="background:#2563eb; color:white; width:100%; padding:15px; border:none; border-radius:12px; font-size:18px; font-weight:bold; margin-top:10px;">
    🔐 Owner Login
  </button>
</a>
        
        <div id="locationBox" class="location-box"></div>

        <div id="resultMessage" class="result-message"></div>

    </div>

    

<footer>
    © 2026 StudySpot • Find. Choose. Study.
</footer>

<script>

let selectedRadius = 5;
    
    const libraries = [
    {
        name: "Example Study Library",
        city: "Jaunpur",
        latitude: 25.7460,
        longitude: 82.6837,
        price: 500,
        facilities: ["Wi-Fi", "AC", "Power Backup", "Silent Zone"]
    },

    {
        name: "Smart Study Point",
        city: "Jaunpur",
        latitude: 25.7505,
        longitude: 82.6900,
        price: 700,
        facilities: ["AC", "Wi-Fi", "CCTV", "24×7"]
    }
];

function selectRadius(radius) {

    selectedRadius = radius;

    document
        .querySelectorAll(".radius-button")
        .forEach(button => {
            button.classList.remove("active");
        });

    document
        .getElementById("radius" + radius)
        .classList.add("active");

    const message = document.getElementById("resultMessage");

    message.style.display = "block";

    message.innerHTML =
        "📍 Libraries within " +
        radius +
        " km will be searched.";
}

function showLibraryDetails(index) {

    const library = libraries[index];

    const button =
        document.querySelectorAll(".details")[index];

    const card =
        button.closest(".library-card");

    let details =
        card.querySelector(".library-details");

    if (!details) {

        details =
            document.createElement("div");

        details.className = "library-details";

        card.appendChild(details);
    }

    details.innerHTML =
        "<hr>" +
        "<h3>📚 " + library.name + "</h3>" +
        "<p>📍 Location: " + library.city + "</p>" +
        "<p>💰 Price: ₹" + library.price + " / Month</p>" +
        "<p>✨ <b>Facilities:</b><br>" +
        library.facilities.join(" • ") +
        "</p>" +
      "<p>📏 Distance will be shown after location search.</p>" +
"<button onclick=\"window.open('https://www.google.com/maps/dir/?api=1&destination=" +
library.latitude + "," + library.longitude +
"', '_blank')\">" +
"🗺️ Get Directions</button>";
}
    

function findNearby() {
    const locationBox = document.getElementById("locationBox");
    const message = document.getElementById("resultMessage");
    const container = document.getElementById("librariesContainer");
    const client = window.supabaseClient;

    locationBox.style.display = "block";
    message.style.display = "block";

    locationBox.innerHTML = "📍 Getting your location...";
    message.innerHTML = "";

    if (!client) {
        locationBox.innerHTML =
            "❌ Unable to connect to the library database.";
        return;
    }

    if (!navigator.geolocation) {
        locationBox.innerHTML =
            "❌ Location is not supported by this browser.";
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async function(position) {

            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            locationBox.innerHTML =
                "✅ Location found.<br><br>" +
                "📍 Searching libraries within " +
                selectedRadius +
                " km...";

            const { data: libraries, error } = await client
                .from("libraries")
                .select("*")
                .not("latitude", "is", null)
                .not("longitude", "is", null);

            if (error) {
                console.error("Nearby library error:", error);

                locationBox.innerHTML =
                    "❌ Unable to load nearby libraries.";

                return;
            }

            function calculateDistance(lat1, lon1, lat2, lon2) {

                const R = 6371;

                const dLat =
                    (lat2 - lat1) * Math.PI / 180;

                const dLon =
                    (lon2 - lon1) * Math.PI / 180;

                const a =
                    Math.sin(dLat / 2) *
                    Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) *
                    Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) *
                    Math.sin(dLon / 2);

                const c =
                    2 * Math.atan2(
                        Math.sqrt(a),
                        Math.sqrt(1 - a)
                    );

                return R * c;
            }

            const nearbyLibraries = libraries
                .map(function(library) {

                    const distance =
                        calculateDistance(
                            userLat,
                            userLon,
                            Number(library.latitude),
                            Number(library.longitude)
                        );

                    return {
                        ...library,
                        distance: distance
                    };
                })
                .filter(function(library) {

                    return library.distance <= selectedRadius;

                })
                .sort(function(a, b) {

                    return a.distance - b.distance;

                });

            if (nearbyLibraries.length === 0) {

                message.innerHTML =
                    "😕 No libraries found within " +
                    selectedRadius +
                    " km.";

                container.innerHTML =
                    "<p>No study libraries were found within the selected distance.</p>";

                return;
            }

            message.innerHTML =
                "📚 " +
                nearbyLibraries.length +
                " library/libraries found within " +
                selectedRadius +
                " km.";

            container.innerHTML = "";

            nearbyLibraries.forEach(function(library) {

                const card =
                    document.createElement("div");

                card.style.cssText = `
                    background:white;
                    padding:16px;
                    margin-bottom:15px;
                    border-radius:12px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.08);
                `;

                card.innerHTML = `
                    <h3 style="margin:0 0 8px;">
                        ${library.library_name || "Study Library"}
                    </h3>

                    <p style="margin:5px 0;">
                        <strong>Location:</strong>
                        ${library.city || ""}, ${library.district || ""}
                    </p>

                    <p style="margin:5px 0;">
                        <strong>Distance:</strong>
                        ${library.distance.toFixed(2)} km
                    </p>

                    <p style="margin:5px 0;">
                        <strong>Monthly Fee:</strong>
                        ₹${library.monthly_fee || "Not available"}
                    </p>

                    <p style="margin:5px 0;">
                        <strong>Available Seats:</strong>
                        ${library.seat_availability ?? "Not available"}
                    </p>
                `;

                container.appendChild(card);

            });

        },

        function(error) {

            locationBox.innerHTML =
                "❌ Location Error<br><br>" +
                "Code: " +
                error.code +
                "<br>Reason: " +
                error.message;

        },

        {
            enableHighAccuracy: false,
            timeout: 15000,
            maximumAge: 300000
        }
    );
}
function searchAnywhere() {

    const search =
        document.getElementById("searchInput").value.trim();

    const message =
        document.getElementById("resultMessage");

    message.style.display = "block";

    if (search === "") {

        message.innerHTML =
            "🔎 Please enter a city, area or library name.";

    } else {

        message.innerHTML =
            "🌍 Searching StudySpot for: <b>" +
            search +
            "</b>";

    }
}

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

    
<!-- StudySpot Library Listings -->
<section id="libraryListings" style="padding:20px;">
  <h2 style="margin-bottom:15px;">Nearby Study Libraries</h2>

  <div id="librariesContainer">
    <p>Loading libraries...</p>
  </div>
</section>   

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const container = document.getElementById("librariesContainer");
  const client = window.supabaseClient;

  if (!container) return;

  if (!client) {
    container.innerHTML = "<p>Unable to connect to the library database.</p>";
    return;
  }

  const { data: libraries, error } = await client
    .from("libraries")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Library loading error:", error);
    container.innerHTML = "<p>Unable to load libraries.</p>";
    return;
  }

  if (!libraries || libraries.length === 0) {
    container.innerHTML = "<p>No study libraries are available yet.</p>";
    return;
  }

  container.innerHTML = "";

  libraries.forEach(function (library) {
    const card = document.createElement("div");

    card.style.cssText = `
      background:white;
      padding:16px;
      margin-bottom:15px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    `;

    card.innerHTML = `
      <h3 style="margin:0 0 8px;">${library.library_name || "Study Library"}</h3>
      <p style="margin:5px 0;"><strong>Location:</strong> ${library.city || ""}, ${library.district || ""}</p>
      <p style="margin:5px 0;"><strong>Monthly Fee:</strong> ₹${library.monthly_fee || "Not available"}</p>
      <p style="margin:5px 0;"><strong>Available Seats:</strong> ${library.seat_availability ?? "Not available"}</p>
    `;

    container.appendChild(card);
  });
});
</script>
    
</body>
</html>
