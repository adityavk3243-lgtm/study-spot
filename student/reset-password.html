<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudySpot - Reset Password</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 5px 22px rgba(0,0,0,0.08);
    }

    .icon {
      text-align: center;
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: 27px;
    }

    .description {
      text-align: center;
      color: #667085;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dbe7;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🔐</div>

    <h1>Reset Password</h1>

    <p class="description">
      Create a new password for your StudySpot student account.
    </p>

    <label for="newPassword">
      New Password
    </label>

    <input
      id="newPassword"
      type="password"
      placeholder="Enter your new password"
    >

    <label for="confirmPassword">
      Confirm New Password
    </label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="Confirm your new password"
    >

    <button
      id="updatePasswordButton"
      type="button"
    >
      Update Password
    </button>

    <div id="message"></div>

    <a
      class="back"
      href="student-login.html"
    >
      Back to Student Login
    </a>

  </div>

  <script>

    const client = window.supabaseClient;

    const button =
      document.getElementById("updatePasswordButton");

    const message =
      document.getElementById("message");

    button.addEventListener("click", async function () {

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.textContent = "";
      message.style.color = "#667085";

      if (!newPassword || !confirmPassword) {

        message.textContent =
          "Please enter and confirm your new password.";

        message.style.color = "#dc2626";

        return;
      }

      if (newPassword.length < 6) {

        message.textContent =
          "Password must be at least 6 characters long.";

        message.style.color = "#dc2626";

        return;
      }

      if (newPassword !== confirmPassword) {

        message.textContent =
          "Passwords do not match.";

        message.style.color = "#dc2626";

        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      const { error } =
        await client.auth.updateUser({
          password: newPassword
        });

      if (error) {

        console.error(error);

        message.textContent =
          "Unable to update password. Please try the password reset link again.";

        message.style.color = "#dc2626";

        button.disabled = false;
        button.textContent = "Update Password";

        return;
      }

      message.textContent =
        "Password updated successfully. You can now log in with your new password.";

      message.style.color = "#16a34a";

      button.textContent = "Password Updated";

      setTimeout(function () {
        window.location.href = "student-login.html";
      }, 2000);

    });

  </script>

</body>
</html>
