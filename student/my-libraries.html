<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Libraries - StudySpot</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f7ff;
      color: #172033;
      font-family: Arial, sans-serif;
      padding-bottom: 30px;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.18);
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin: 8px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .libraries-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .library-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
      border: 1px solid #e4e9f2;
    }

    .library-name {
      font-size: 21px;
      font-weight: 800;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .library-location {
      color: #667085;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .status {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail-box {
      background: #f5f7fb;
      border-radius: 12px;
      padding: 12px;
    }

    .detail-label {
      color: #667085;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
    }

    .view-button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-card {
      background: white;
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .empty-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 21px;
      font-weight: 800;
    }

    .empty-text {
      color: #667085;
      line-height: 1.5;
      margin-top: 8px;
    }

    .search-button {
      margin-top: 18px;
      border: none;
      border-radius: 13px;
      padding: 13px 20px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .message {
      text-align: center;
      color: #dc2626;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      class="back-button"
      type="button"
      onclick="window.location.href='index.html'"
    >
      ←
    </button>

    <div class="brand">
      📖 StudySpot My Libraries
    </div>

  </header>


  <main class="page">

    <div class="title">
      My Libraries
    </div>

    <div class="subtitle">
      Your active StudySpot library memberships
    </div>


    <div
      id="librariesContainer"
      class="libraries-container"
    >

      <div class="empty-card">
        Loading your libraries...
      </div>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </main>


  <script>

    async function loadMyLibraries() {

      if (!window.supabaseClient) {

        document.getElementById("message").textContent =
          "StudySpot connection is not ready. Please refresh the page.";

        return;
      }


      const {
        data: sessionData,
        error: sessionError
      } = await window.supabaseClient.auth.getSession();


      if (sessionError || !sessionData.session) {

        window.location.href =
          "../student-login.html";

        return;
      }


      const user =
        sessionData.session.user;


      const {
        data: memberships,
        error
      } = await window.supabaseClient
        .from("student_memberships")
        .select(`
          membership_type,
          start_date,
          due_date,
          seat_number,
          status,
          libraries (
            id,
            library_name,
            city,
            district,
            state
          )
        `)
        .eq("student_id", user.id)
        .eq("status", "active")
        .order("created_at", {
          ascending: false
        });


      const container =
        document.getElementById("librariesContainer");


      if (error) {

        container.innerHTML = `
          <div class="empty-card">
            <div class="empty-icon">⚠️</div>

            <div class="empty-title">
              Unable to Load Libraries
            </div>

            <div class="empty-text">
              Please refresh the page and try again.
            </div>
          </div>
        `;

        return;
      }


      if (!memberships || memberships.length === 0) {

        container.innerHTML = `
          <div class="empty-card">

            <div class="empty-icon">
              📖
            </div>

            <div class="empty-title">
              No Active Memberships
            </div>

            <div class="empty-text">
              You do not have any active StudySpot library memberships yet.
            </div>

            <button
              class="search-button"
              type="button"
              onclick="window.location.href='libraries.html'"
            >
              Find a Study Library
            </button>

          </div>
        `;

        return;
      }


      container.innerHTML = "";


      memberships.forEach(function(membership) {

        const library =
          membership.libraries || {};


        const card =
          document.createElement("div");

        card.className =
          "library-card";


        const locationParts = [];

        if (library.city) {
          locationParts.push(library.city);
        }

        if (library.district) {
          locationParts.push(library.district);
        }

        if (library.state) {
          locationParts.push(library.state);
        }


        const location =
          locationParts.join(", ");


        card.innerHTML = `

          <div class="library-name">
            ${library.library_name || "Study Library"}
          </div>

          <div class="library-location">
            📍 ${location || "Location not available"}
          </div>

          <div class="status">
            ${(membership.status || "active").toUpperCase()}
          </div>

          <div class="details">

            <div class="detail-box">

              <div class="detail-label">
                Membership Type
              </div>

              <div class="detail-value">
                ${membership.membership_type || "Membership"}
              </div>

            </div>


            <div class="detail-box">

              <div class="detail-label">
                Seat Number
              </div>

              <div class="detail-value">
                ${membership.seat_number || "Not assigned"}
              </div>

            </div>


            <div class="detail-box">

              <div class="detail-label">
                Membership Date
              </div>

              <div class="detail-value">
                ${membership.start_date || "Not available"}
              </div>

            </div>


            <div class="detail-box">

              <div class="detail-label">
                Due Date
              </div>

              <div class="detail-value">
                ${membership.due_date || "Not available"}
              </div>

            </div>

          </div>


          ${
            library.id
            ? `
              <button
                class="view-button"
                type="button"
                onclick="window.location.href='../library-details.html?id=${library.id}'"
              >
                View Library Details
              </button>
            `
            : ""
          }

        `;


        container.appendChild(card);

      });

    }


    loadMyLibraries();

  </script>

</body>
</html>
