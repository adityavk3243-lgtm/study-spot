<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    /* ---------- BRAND HEADER ---------- */

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 30px 18px 34px;
    }

    .logo {
      font-size: 58px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .brand {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .tagline {
      margin: 8px 0 0;
      font-size: 17px;
      opacity: 0.95;
    }

    /* ---------- MAIN ---------- */

    .page {
      padding: 28px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 470px;
      margin: auto;
    }

    .login-card {
      background: white;
      border-radius: 22px;
      padding: 25px 20px;
      box-shadow: 0 5px 22px rgba(0,0,0,0.09);
    }

    .welcome-icon {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
      margin: 9px 0 24px;
    }

    /* ---------- FORM ---------- */

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    button {
      font-family: inherit;
    }

    .primary-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:active {
      transform: scale(0.99);
    }

    .secondary-button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 2px solid #2563eb;
      border-radius: 12px;
      background: white;
      color: #2563eb;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 5px;
      color: #98a2b3;
      font-size: 13px;
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e4e7ec;
      flex: 1;
    }

    .switch-text {
      text-align: center;
      margin: 22px 0 0;
      font-size: 14px;
    }

    .switch-text button {
      border: none;
      background: none;
      color: #2563eb;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ---------- SIGN UP ---------- */

    .signup-note {
      background: #f0f6ff;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 15px;
      color: #344054;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    /* ---------- FOOTER ---------- */

    .footer {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-top: 24px;
    }

    .hidden {
      display: none;
    }

    /* ---------- SMALL PHONES ---------- */

    @media (max-width: 380px) {
      .hero {
        padding: 25px 14px 28px;
      }

      .logo {
        font-size: 50px;
      }

      .brand {
        font-size: 33px;
      }

      .tagline {
        font-size: 15px;
      }

      .login-card {
        padding: 22px 16px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>

<body>

  <!-- BRAND HEADER -->
  <header class="hero">
    <div class="logo">📚</div>
    <div class="brand">StudySpot</div>
    <div class="tagline">Find the perfect study library near you</div>
  </header>


  <main class="page">

    <div class="container">

      <div class="login-card">

        <!-- LOGIN SECTION -->
        
<div id="loginSection">

  <h2 style="text-align:center;margin-bottom:20px;">
    🔐 Student Login
  </h2>

  <label style="display:block;margin-bottom:6px;font-weight:600;">
    Email or Mobile Number
  </label>

  <input
    type="text"
    id="loginIdentifier"
    placeholder="Enter your email or mobile number"
    style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:15px;font-size:16px;"
  >

  <label style="display:block;margin-bottom:6px;font-weight:600;">
    Password
  </label>

  <input
    type="password"
    id="loginPassword"
    placeholder="Enter your password"
    style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:10px;font-size:16px;"
  >

  <button
    type="button"
    id="loginButton"
    style="width:100%;padding:14px;border:none;border-radius:10px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer;"
  >
    Login
  </button>

  <button
    type="button"
    id="forgotPasswordButton"
    style="display:block;margin:15px auto 0;border:none;background:none;color:#2563eb;font-size:15px;cursor:pointer;"
  >
    Forgot Password?
  </button>

  <p style="text-align:center;margin-top:20px;">
    Don't have an account?
    <button
      type="button"
      onclick="showSignup()"
      style="border:none;background:none;color:#2563eb;font-weight:700;cursor:pointer;"
    >
      Create Account
    </button>
  </p>

</div>

        <!-- SIGN UP SECTION -->

        <div id="signupSection" class="hidden">

          <div class="welcome-icon">👤</div>

          <h2>Create Account</h2>

          <p class="subtitle">
            Create your StudySpot student account.
          </p>

          <div class="signup-note">
            Your mobile number and email can be verified with OTP.
          </div>


          <label for="signupName">
            Full Name
          </label>

          <input
            id="signupName"
            type="text"
            placeholder="Enter full name"
          >


          <label for="signupMobile">
            Mobile Number
          </label>

          <input
            id="signupMobile"
            type="tel"
            inputmode="numeric"
            placeholder="Enter mobile number"
          >


          <label for="signupEmail">
            Email Address
          </label>

          <input
            id="signupEmail"
            type="email"
            placeholder="Enter email address"
          >


          <label for="signupPassword">
            Password
          </label>

          <input
            id="signupPassword"
            type="password"
            placeholder="Create password"
          >


          <label for="signupConfirmPassword">
            Confirm Password
          </label>

          <input
            id="signupConfirmPassword"
            type="password"
            placeholder="Confirm password"
          >


          <button
            id="createAccountButton"
            class="primary-button"
            type="button"
          >
            Create Account
          </button>


          <p class="switch-text">
            Already have an account?

            <button
              type="button"
              onclick="showLogin()"
            >
              Login
            </button>
          </p>

        </div>

      </div>


      <div class="footer">
        © 2026 StudySpot • Find. Choose. Study.
      </div>

    </div>

  </main>


 <script>

  let otpMethod = "";
  let otpDestination = "";


  function showSignup() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("signupSection")
      .classList.remove("hidden");
  }


  function showLogin() {

    document
      .getElementById("signupSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");
  }  

async function studentLogin() {

  const identifier =
    document.getElementById("loginIdentifier").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!identifier) {
    alert("Please enter your email or mobile number.");
    return;
  }

  if (!password) {
    alert("Please enter your password.");
    return;
  }

  let loginData = {};

  if (identifier.includes("@")) {

    loginData = {
      email: identifier,
      password: password
    };

  } else {

    let phone = identifier.replace(/\s+/g, "");

    if (/^\d{10}$/.test(phone)) {
      phone = "+91" + phone;
    }

    loginData = {
      phone: phone,
      password: password
    };
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword(loginData);

  if (error) {
    alert("Login failed: " + error.message);
    return;
  }

  if (data && data.user) {
    alert("Login successful.");

    window.location.href = "student/index.html";
  }
}


document
  .getElementById("loginButton")
  .addEventListener("click", studentLogin);


document
  .getElementById("forgotPasswordButton")
  .addEventListener("click", function () {

    alert("Password recovery will be added in the next step.");

  });
   document
  .getElementById("createAccountButton")
  .addEventListener("click", async function () {

    const name =
      document.getElementById("signupName").value.trim();

    const mobile =
      document.getElementById("signupMobile").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirmPassword").value;

    if (!name) {
      alert("Please enter your full name.");
      return;
    }

    if (!mobile) {
      alert("Please enter your mobile number.");
      return;
    }

    if (!email) {
      alert("Please enter your email address.");
      return;
    }

    if (!password) {
      alert("Please create a password.");
      return;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return;
    }

    let formattedMobile = mobile.replace(/\s+/g, "");

    if (/^\d{10}$/.test(formattedMobile)) {
      formattedMobile = "+91" + formattedMobile;
    }

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name,
            mobile: formattedMobile
          }
        }
      });

    if (error) {
      alert("Account creation failed: " + error.message);
      return;
    }

    if (data && data.user) {
      alert(
        "Account created successfully. Please verify your account before logging in."
      );

      showLogin();
    }
  });
</script> 
<script>
  if (window.supabaseClient) {
    console.log("StudySpot Supabase connected successfully.");
  } else {
    console.error("StudySpot Supabase connection failed.");
  }
</script>
</body>
</html>
