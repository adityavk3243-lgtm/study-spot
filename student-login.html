<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    /* ---------- BRAND HEADER ---------- */

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 30px 18px 34px;
    }

    .logo {
      font-size: 58px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .brand {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .tagline {
      margin: 8px 0 0;
      font-size: 17px;
      opacity: 0.95;
    }

    /* ---------- MAIN ---------- */

    .page {
      padding: 28px 16px 40px;
    }

    .container {
      width: 100%;
      max-width: 470px;
      margin: auto;
    }

    .login-card {
      background: white;
      border-radius: 22px;
      padding: 25px 20px;
      box-shadow: 0 5px 22px rgba(0,0,0,0.09);
    }

    .welcome-icon {
      text-align: center;
      font-size: 42px;
      margin-bottom: 5px;
    }

    h2 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      font-size: 15px;
      line-height: 1.5;
      margin: 9px 0 24px;
    }

    /* ---------- FORM ---------- */

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    button {
      font-family: inherit;
    }

    .primary-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:active {
      transform: scale(0.99);
    }

    .secondary-button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 2px solid #2563eb;
      border-radius: 12px;
      background: white;
      color: #2563eb;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 5px;
      color: #98a2b3;
      font-size: 13px;
      font-weight: 600;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e4e7ec;
      flex: 1;
    }

    .switch-text {
      text-align: center;
      margin: 22px 0 0;
      font-size: 14px;
    }

    .switch-text button {
      border: none;
      background: none;
      color: #2563eb;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* ---------- SIGN UP ---------- */

    .signup-note {
      background: #f0f6ff;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 15px;
      color: #344054;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    /* ---------- FOOTER ---------- */

    .footer {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-top: 24px;
    }

    .hidden {
      display: none;
    }

    /* ---------- SMALL PHONES ---------- */

    @media (max-width: 380px) {
      .hero {
        padding: 25px 14px 28px;
      }

      .logo {
        font-size: 50px;
      }

      .brand {
        font-size: 33px;
      }

      .tagline {
        font-size: 15px;
      }

      .login-card {
        padding: 22px 16px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>

<body>

  <!-- BRAND HEADER -->
  <header class="hero">
    <div class="logo">📚</div>
    <div class="brand">StudySpot</div>
    <div class="tagline">Find the perfect study library near you</div>
  </header>


  <main class="page">

    <div class="container">

      <div class="login-card">

        <!-- LOGIN SECTION -->
        
<div id="loginSection">

  <h2 style="text-align:center;margin-bottom:20px;">
    🔐 Student Login
  </h2>

  <label style="display:block;margin-bottom:6px;font-weight:600;">
    Email or Mobile Number
  </label>

  <input
    type="text"
    id="loginIdentifier"
    placeholder="Enter your email or mobile number"
    style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:15px;font-size:16px;"
  >

  <label style="display:block;margin-bottom:6px;font-weight:600;">
    Password
  </label>

  <input
    type="password"
    id="loginPassword"
    placeholder="Enter your password"
    style="width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:10px;font-size:16px;"
  >

  <button
    type="button"
    id="loginButton"
    style="width:100%;padding:14px;border:none;border-radius:10px;background:#2563eb;color:white;font-size:16px;font-weight:700;cursor:pointer;"
  >
    Login
  </button>

  <button
    type="button"
    id="forgotPasswordButton"
    style="display:block;margin:15px auto 0;border:none;background:none;color:#2563eb;font-size:15px;cursor:pointer;"
  >
    Forgot Password?
  </button>

  <p style="text-align:center;margin-top:20px;">
    Don't have an account?
    <button
      type="button"
      onclick="showSignup()"
      style="border:none;background:none;color:#2563eb;font-weight:700;cursor:pointer;"
    >
      Create Account
    </button>
  </p>

</div>

        <!-- SIGN UP SECTION -->

        <div id="signupSection" class="hidden">

          <div class="welcome-icon">👤</div>

          <h2>Create Account</h2>

          <p class="subtitle">
            Create your StudySpot student account.
          </p>

          <div class="signup-note">
            Your mobile number and email can be verified with OTP.
          </div>


          <label for="signupName">
            Full Name
          </label>

          <input
            id="signupName"
            type="text"
            placeholder="Enter full name"
          >


          <label for="signupMobile">
            Mobile Number
          </label>

          <input
            id="signupMobile"
            type="tel"
            inputmode="numeric"
            placeholder="Enter mobile number"
          >


          <label for="signupEmail">
            Email Address
          </label>

          <input
            id="signupEmail"
            type="email"
            placeholder="Enter email address"
          >


          <label for="signupPassword">
            Password
          </label>

          <input
            id="signupPassword"
            type="password"
            placeholder="Create password"
          >


          <label for="signupConfirmPassword">
            Confirm Password
          </label>

          <input
            id="signupConfirmPassword"
            type="password"
            placeholder="Confirm password"
          >


          <button
            class="primary-button"
            type="button"
          >
            Create Account
          </button>


          <p class="switch-text">
            Already have an account?

            <button
              type="button"
              onclick="showLogin()"
            >
              Login
            </button>
          </p>

        </div>

      </div>


      <div class="footer">
        © 2026 StudySpot • Find. Choose. Study.
      </div>

    </div>

  </main>


 <script>

  let otpMethod = "";
  let otpDestination = "";


  function showSignup() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("signupSection")
      .classList.remove("hidden");
  }


  function showLogin() {

    document
      .getElementById("signupSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");
  }


  async function sendEmailOTP() {

    const email =
      document.getElementById("loginEmail").value.trim();

    if (!email) {
      alert("Please enter your email address.");
      return;
    }

    otpMethod = "email";
    otpDestination = email;

    const { error } =
      await supabaseClient.auth.signInWithOtp({
        email: email,
        options: {
          shouldCreateUser: true
        }
      });

    if (error) {
      alert(
        "Unable to send email OTP: " +
        error.message
      );
      return;
    }

    showOTPBox();

    document.getElementById("otpMessage").textContent =
      "A verification code has been sent to your email address.";
  }


  async function sendMobileOTP() {

    const mobile =
      document.getElementById("loginMobile").value.trim();

    if (!mobile) {
      alert("Please enter your mobile number.");
      return;
    }

    otpMethod = "phone";
    otpDestination = mobile;

    const { error } =
      await supabaseClient.auth.signInWithOtp({
        phone: mobile
      });

    if (error) {
      alert(
        "Mobile OTP is not active yet. " +
        "Please use Email OTP for testing."
      );
      return;
    }

    showOTPBox();

    document.getElementById("otpMessage").textContent =
      "A verification code has been sent to your mobile number.";
  }


  function showOTPBox() {

    let existingBox =
      document.getElementById("studentOTPBox");

    if (existingBox) {
      existingBox.classList.remove("hidden");
      return;
    }

    const box =
      document.createElement("div");

    box.id = "studentOTPBox";

    box.style.marginTop = "20px";
    box.style.padding = "16px";
    box.style.background = "#f0f6ff";
    box.style.borderRadius = "12px";

    box.innerHTML = `

      <h3 style="
        margin:0 0 8px;
        text-align:center;
      ">
        Enter OTP
      </h3>

      <p
        id="otpMessage"
        style="
          margin:0 0 12px;
          text-align:center;
          color:#667085;
          font-size:14px;
          line-height:1.5;
        "
      ></p>

      <input
        id="studentOTP"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
        style="
          width:100%;
          padding:14px;
          border:1px solid #d0d5dd;
          border-radius:10px;
          font-size:18px;
          text-align:center;
          letter-spacing:5px;
        "
      >

      <button
        type="button"
        onclick="verifyStudentOTP()"
        style="
          width:100%;
          margin-top:12px;
          padding:14px;
          border:none;
          border-radius:10px;
          background:#2563eb;
          color:white;
          font-size:16px;
          font-weight:700;
        "
      >
        Verify OTP
      </button>

      <button
        type="button"
        onclick="closeOTPBox()"
        style="
          width:100%;
          margin-top:8px;
          padding:12px;
          border:none;
          background:transparent;
          color:#2563eb;
          font-size:14px;
          font-weight:700;
        "
      >
        Change Email / Mobile Number
      </button>
    `;

    document
      .getElementById("loginSection")
      .appendChild(box);
  }


  async function verifyStudentOTP() {

    const token =
      document.getElementById("studentOTP").value.trim();

    if (!token) {
      alert("Please enter the OTP.");
      return;
    }

    let result;

    if (otpMethod === "email") {

      result =
        await supabaseClient.auth.verifyOtp({
          email: otpDestination,
          token: token,
          type: "email"
        });

    } else if (otpMethod === "phone") {

      result =
        await supabaseClient.auth.verifyOtp({
          phone: otpDestination,
          token: token,
          type: "sms"
        });
    }

    if (result.error) {

      alert(
        "OTP verification failed: " +
        result.error.message
      );

      return;
    }

    alert("Login successful.");

    window.location.href =
      "../index.html";
  }


  function closeOTPBox() {

    const box =
      document.getElementById("studentOTPBox");

    if (box) {
      box.remove();
    }

    otpMethod = "";
    otpDestination = "";
  }


  document.addEventListener(
    "DOMContentLoaded",
    function () {

      const mobileButton =
        document.querySelector(
          "#loginMobile + button"
        );

      const emailButton =
        document.querySelector(
          "#loginEmail + button"
        );

      if (mobileButton) {
        mobileButton.onclick =
          sendMobileOTP;
      }

      if (emailButton) {
        emailButton.onclick =
          sendEmailOTP;
      }

    }
  );

</script> 
<script>
  if (window.supabaseClient) {
    console.log("StudySpot Supabase connected successfully.");
  } else {
    console.error("StudySpot Supabase connection failed.");
  }
</script>
</body>
</html>
