
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 34px;
    }

    .header p {
      margin: 10px 0 0;
      font-size: 17px;
    }

    .container {
      max-width: 500px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .login-box {
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #1e293b;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .login-button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      line-height: 1.8;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .back-button {
      display: block;
      text-align: center;
      margin-top: 20px;
      padding: 13px;
      border-radius: 10px;
      background: #e2e8f0;
      color: #1e293b;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #fef3c7;
      color: #92400e;
    }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
  
</head>

<body>

  <div class="header">
    <h1>📚 StudySpot</h1>
    <p>Library Owner Login</p>
  </div>

  <div class="container">
    <div class="login-box">
      <h2>🔐 Owner Login</h2>

      <form id="loginForm">
        <label for="email">Email Address</label>
<input
  type="email"
  id="email"
  placeholder="Enter your email address"
  required
>

<label for="mobile">Mobile Number</label>
<input
  type="tel"
  id="mobile"
  placeholder="Enter your mobile number"
  required
>

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

<div style="text-align: right; margin-top: 10px;">
  <a href="#" id="forgotPassword">Forgot Password?</a>
</div>
        
        <button type="submit" class="login-button">
          Login
        </button>
      </form>

      <div id="message" class="message"></div>

      <div class="register-link">
        New library owner?
        <br>
        <a href="owner.html">Create an account</a>
      </div>

      <a class="back-button" href="index.html">
        ⬅️ Back to StudySpot
      </a>
    </div>
  </div>

  <script>
document.getElementById("loginForm").addEventListener("submit", async function (event) {
  event.preventDefault();

  const email = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Logging in...";
  message.style.color = "#2563eb";

  const { data, error } = await window.supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = "Login failed: " + error.message;
    message.style.color = "red";
    return;
  }

  message.textContent = "Login successful. Redirecting...";
  message.style.color = "green";

  window.location.href = "owner-dashboard.html";
});
</script>

</body>
</html>
