<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Details - StudySpot</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #f4f7fb;
    font-family: Arial, sans-serif;
    color: #172033;
  }

  .app-header {
    background: #2563eb;
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }

  .back-button {
    border: none;
    background: rgba(255,255,255,0.18);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    font-size: 22px;
    cursor: pointer;
  }

  .brand {
    font-size: 21px;
    font-weight: 700;
  }

  .page {
    padding: 18px 14px 30px;
    max-width: 600px;
    margin: auto;
  }

  .library-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
  }

  .library-card h1,
  .library-card h2 {
    margin-top: 0;
    margin-bottom: 18px;
    font-size: 25px;
    color: #172033;
  }

  .library-card p {
    margin: 10px 0;
    line-height: 1.5;
    font-size: 15px;
    color: #4b5563;
  }

  .library-card strong {
    color: #172033;
  }

  .section-title {
    margin: 22px 0 10px;
    font-size: 17px;
    font-weight: 700;
    color: #172033;
  }
  .profile-header {
  margin-bottom: 18px;
}

.library-title h1 {
  font-size: 26px;
  margin: 0 0 7px;
  color: #172033;
}

.location-text {
  margin: 0 !important;
  color: #64748b !important;
  font-size: 14px !important;
}

.quick-info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 24px;
}

.info-box {
  background: #ffffff;
  border-radius: 15px;
  padding: 13px 7px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.info-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 6px;
}

.info-box strong {
  display: block;
  font-size: 15px;
  color: #172033;
}

.info-box small {
  display: block;
  margin-top: 4px;
  font-size: 11px;
  color: #64748b;
}

.detail-section {
  margin-top: 22px;
}

.detail-section h2 {
  font-size: 18px;
  margin: 0 0 10px;
  color: #172033;
}

.detail-card,
.rules-card {
  background: #ffffff;
  border-radius: 15px;
  padding: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.detail-card p {
  margin: 6px 0 14px;
}

.detail-card p:last-child {
  margin-bottom: 0;
}

.fee-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.fee-card {
  background: #ffffff;
  border-radius: 15px;
  padding: 15px 8px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.fee-card span {
  display: block;
  font-size: 13px;
  color: #64748b;
  margin-bottom: 7px;
}

.fee-card strong {
  font-size: 17px;
  color: #172033;
}

.row-item {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  border-bottom: 1px solid #eef2f7;
}

.row-item:first-child {
  padding-top: 0;
}

.row-item:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.row-item span {
  color: #64748b;
}

.row-item strong {
  color: #172033;
  text-align: right;
}

.open-status {
  color: #15803d;
  font-weight: 700;
  text-align: center;
  padding: 8px;
}

.facility-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.facility {
  background: #eaf2ff;
  color: #2563eb;
  border-radius: 20px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
}

.rules-card p {
  margin: 0;
  line-height: 1.6;
  white-space: pre-line;
}

.contact-button {
  width: 100%;
  margin-top: 24px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(37,99,235,0.25);
}

.powered-by {
  text-align: center;
  margin: 25px 0 5px !important;
  color: #94a3b8 !important;
  font-size: 12px !important;
}
</style>

</head>

<body>

  <header class="app-header">
  <button class="back-button" onclick="history.back()">‹</button>
  <div class="brand">StudySpot</div>
</header>

<main class="page">
  <div class="library-card" id="libraryDetails">
    <p>Loading library details...</p>
  </div>
</main>
  
<script>
const params = new URLSearchParams(window.location.search);
const libraryId = params.get("id");

console.log("Library ID:", libraryId);
</script>

<script>
async function loadLibraryDetails() {
  const container = document.getElementById("libraryDetails");
  const client = window.supabaseClient;

  if (!libraryId) {
    container.innerHTML = "<p>Library information is missing.</p>";
    return;
  }

  if (!client) {
    container.innerHTML =
      "<p>Unable to connect to the library database.</p>";
    return;
  }

  const { data: library, error } = await client
    .from("libraries")
    .select("*")
    .eq("id", libraryId)
    .single();

  if (error || !library) {
    console.error("Library details error:", error);

    container.innerHTML =
      "<p>Unable to load library details.</p>";

    return;
  }
  window.currentLibraryData = library;
  
container.innerHTML = `
  <div class="profile-header">
    <div class="library-title">
      <h1>${library.library_name || "Study Library"}</h1>
      <p class="location-text">
        📍 ${library.city || ""}${library.city && library.district ? ", " : ""}${library.district || ""}${library.state ? ", " + library.state : ""}
      </p>
    </div>
  </div>



  <div class="quick-info">
    <div class="info-box">
      <span class="info-icon">💺</span>
      <strong>${library.seat_availability ?? "—"}</strong>
      <small>Available Seats</small>
    </div>

    <div class="info-box">
      <span class="info-icon">💰</span>
      <strong>₹${library.monthly_fee ?? "—"}</strong>
      <small>Monthly Fee</small>
    </div>

    <div class="info-box">
      <span class="info-icon">🕐</span>
      <strong>${library.open_24_hours ? "24 Hours" : (library.opening_time || "—")}</strong>
      <small>Opening Time</small>
    </div>
  </div>

  <div class="detail-section">
    <h2>📍 Location</h2>

    <div class="detail-card">
      <p><strong>Address</strong></p>
      <p>${library.address || "Not available"}</p>

      <p><strong>City</strong></p>
      <p>${library.city || "Not available"}</p>

      <p><strong>District</strong></p>
      <p>${library.district || "Not available"}</p>

      <p><strong>State</strong></p>
      <p>${library.state || "Not available"}</p>

${
  library.latitude != null && library.longitude != null
    ? `
      <button
        onclick="window.open(
          'https://www.google.com/maps/dir/?api=1&destination=${library.latitude},${library.longitude}',
          '_blank'
        )"
        style="
          width:100%;
          margin-top:15px;
          padding:14px;
          border:none;
          border-radius:12px;
          background:#2563eb;
          color:white;
          font-size:16px;
          font-weight:700;
          cursor:pointer;
        "
      >
        🗺️ Get Directions
      </button>
    `
    : ""
}
      
    </div>
  </div>

  <div class="detail-section">
    <h2>💰 Fees</h2>

    <div class="fee-grid">
      <div class="fee-card">
        <span>Daily</span>
        <strong>₹${library.daily_fee ?? "—"}</strong>
      </div>

      <div class="fee-grid">
  <div class="fee-card">
    <span>Daily</span>
    <strong>₹${library.daily_fee ?? "—"}</strong>
  </div>

  <div class="fee-card">
    <span>Weekly</span>
    <strong>₹${library.weekly_fee ?? "—"}</strong>
  </div>

  <div class="fee-card">
    <span>Monthly</span>
    <strong>₹${library.monthly_fee ?? "—"}</strong>
  </div>

  <div class="fee-card">
    <span>Security Deposit</span>
    <strong>₹${library.security_deposit ?? "—"}</strong>
  </div>

  <div class="fee-card">
    <span>Registration Fee</span>
    <strong>₹${library.registration_fee ?? "—"}</strong>
  </div>
</div>
  </div>

  <div class="detail-section">
    <h2>💺 Seating Information</h2>

    <div class="detail-card">
      <div class="row-item">
        <span>Available Seats</span>
        <strong>${library.seat_availability ?? "Not available"}</strong>
      </div>

      <div class="row-item">
  <span>Male Seats</span>
  <strong>${library.male_seats ?? "Not available"}</strong>
</div>

<div class="row-item">
  <span>Female Seats</span>
  <strong>${library.female_seats ?? "Not available"}</strong>
</div>
    </div>
  </div>

  <div class="detail-section">
    <h2>🕐 Opening Hours</h2>

    <div class="detail-card">
  ${
    library.open_24_hours
      ? `<div class="open-status">Open 24 Hours</div>`
      : `
        <div class="row-item">
          <span>Opening Time</span>
          <strong>${library.opening_time || "Not available"}</strong>
        </div>

        <div class="row-item">
          <span>Closing Time</span>
          <strong>${library.closing_time || "Not available"}</strong>
        </div>
      `
  }

  <div class="row-item">
    <span>Open Days</span>
    <strong>${library.open_days || "Not available"}</strong>
  </div>
</div>
  </div>

  <div class="detail-section">
    <h2>🏢 Facilities</h2>

    <div class="facility-list">
      ${
        Array.isArray(library.facilities) && library.facilities.length
          ? library.facilities
              .map(facility => `<span class="facility">${facility}</span>`)
              .join("")
          : `<p>No facilities information available.</p>`
      }
    </div>
  </div>

  <div class="detail-section">
    <h2>✨ Other Facilities</h2>

    <div class="detail-card">
      <p>${library.other_facilities || "No additional facilities information available."}</p>
    </div>
  </div>

  <div class="detail-section">
    <h2>📜 Library Rules</h2>

    <div class="rules-card">
      <p>${library.rules || "No library rules provided."}</p>
    </div>
  </div>

${
  Array.isArray(library.photos) && library.photos.length
    ? `
      <div class="detail-section">
        <h2>📸 Library Photos</h2>

        <div style="
          display:grid;
          grid-template-columns:repeat(2,1fr);
          gap:10px;
        ">
          ${library.photos.map(photo => `
            <img
              src="${photo}"
              alt="Library Photo"
              onclick="openPhotoViewer(this.src)"
              style="
                width:100%;
                height:150px;
                object-fit:cover;
                border-radius:14px;
                display:block;
                cursor:pointer;
              "
            >
          `).join("")}
        </div>
      </div>
    `
    : ""
}

   <button
    class="contact-button"
    onclick="joinLibrary()"
    style="
      background:#16a34a;
      margin-top:24px;
    "
  >
    🎫 Join Library
  </button>

  ${
    library.mobile
      ? `
        <button
          class="contact-button"
          onclick="window.location.href='tel:${library.mobile}'"
        >
          📞 Contact Library
        </button>
      `
      : ""
  } 

  <p class="powered-by">StudySpot • Find your perfect study space</p>
`;
}
function openPhotoViewer(photoUrl) {
  const viewer = document.createElement("div");

  viewer.style.position = "fixed";
  viewer.style.top = "0";
  viewer.style.left = "0";
  viewer.style.width = "100%";
  viewer.style.height = "100%";
  viewer.style.background = "rgba(0,0,0,0.92)";
  viewer.style.zIndex = "9999";
  viewer.style.display = "flex";
  viewer.style.alignItems = "center";
  viewer.style.justifyContent = "center";
  viewer.style.padding = "20px";

  viewer.innerHTML = `
    <button
      onclick="this.parentElement.remove()"
      style="
        position:absolute;
        top:15px;
        right:15px;
        width:42px;
        height:42px;
        border:none;
        border-radius:50%;
        background:white;
        color:#172033;
        font-size:25px;
        cursor:pointer;
      "
    >×</button>

    <img
      src="${photoUrl}"
      alt="Library Photo"
      style="
        max-width:100%;
        max-height:90vh;
        object-fit:contain;
        border-radius:10px;
      "
    >
  `;

  viewer.onclick = function(event) {
    if (event.target === viewer) {
      viewer.remove();
    }
  };

  document.body.appendChild(viewer);
}

function joinLibrary() {
  if (!window.currentLibraryData) {
    alert("Library information is not ready. Please try again.");
    return;
  }

  const library = window.currentLibraryData;

  const plans = [];

  if (library.daily_plan_enabled === true) {
    plans.push({
      type: "One Day",
      price: library.daily_fee
    });
  }

  if (library.weekly_plan_enabled === true) {
    plans.push({
      type: "Weekly",
      price: library.weekly_fee
    });
  }

  if (library.monthly_plan_enabled === true) {
    plans.push({
      type: "Monthly",
      price: library.monthly_fee
    });
  }

  if (plans.length === 0) {
    alert("This library has no membership plans available right now.");
    return;
  }

  const overlay = document.createElement("div");

  overlay.style.position = "fixed";
  overlay.style.inset = "0";
  overlay.style.background = "rgba(0,0,0,0.55)";
  overlay.style.zIndex = "9999";
  overlay.style.display = "flex";
  overlay.style.alignItems = "flex-end";
  overlay.style.justifyContent = "center";

  overlay.innerHTML = `
    <div style="
      width:100%;
      max-width:600px;
      background:white;
      border-radius:22px 22px 0 0;
      padding:22px 18px 28px;
      box-shadow:0 -5px 25px rgba(0,0,0,0.18);
    ">

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:18px;
      ">
        <h2 style="
          margin:0;
          font-size:21px;
          color:#172033;
        ">
          Choose Membership Plan
        </h2>

        <button
          onclick="this.closest('div[style*=&quot;position:fixed&quot;]').remove()"
          style="
            border:none;
            background:#eef2f7;
            width:38px;
            height:38px;
            border-radius:50%;
            font-size:22px;
            cursor:pointer;
          "
        >×</button>
      </div>

      <p style="
        margin:0 0 18px;
        color:#64748b;
        font-size:14px;
      ">
        Select the membership duration you want.
      </p>

      <div id="membershipPlanOptions">
        ${plans.map((plan, index) => `
          <label style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            border:2px solid #e5e7eb;
            border-radius:14px;
            padding:15px;
            margin-bottom:10px;
            cursor:pointer;
          ">

            <div>
              <strong style="
                display:block;
                color:#172033;
                font-size:16px;
              ">
                ${plan.type}
              </strong>

              <span style="
                color:#64748b;
                font-size:13px;
              ">
                Membership plan
              </span>
            </div>

            <div style="
              display:flex;
              align-items:center;
              gap:10px;
            ">
              <strong style="
                color:#2563eb;
                font-size:17px;
              ">
                ₹${plan.price ?? "—"}
              </strong>

              <input
                type="radio"
                name="membershipPlan"
                value="${index}"
                style="
                  width:20px;
                  height:20px;
                "
              >
            </div>

          </label>
        `).join("")}
      </div>

      <button
        onclick="continueMembershipSelection()"
        style="
          width:100%;
          margin-top:8px;
          padding:14px;
          border:none;
          border-radius:14px;
          background:#2563eb;
          color:white;
          font-size:16px;
          font-weight:700;
          cursor:pointer;
        "
      >
        Continue
      </button>

    </div>
  `;

  document.body.appendChild(overlay);

  window.currentMembershipPlans = plans;
}

function continueMembershipSelection() {
  const selected = document.querySelector(
    'input[name="membershipPlan"]:checked'
  );

  if (!selected) {
    alert("Please select a membership plan.");
    return;
  }

  const plan =
    window.currentMembershipPlans[
      Number(selected.value)
    ];

  alert(
    "Selected plan: " +
    plan.type +
    " — ₹" +
    plan.price
  );
}
  
  loadLibraryDetails();

</script>
  
</body>
</html>
