<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudySpot - Owner Registration</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7ff;
  color:#222;
}

.header{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  padding:25px 15px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  margin:8px 0 0;
}

.container{
  max-width:650px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  color:#2563eb;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  background:white;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
}

.register{
  background:#2563eb;
  color:white;
}

.location{
  background:#16a34a;
  color:white;
}

.back{
  background:#e5e7eb;
  color:#222;
}

.photo-preview{
  margin-top:10px;
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:10px;
  display:none;
}

.success{
  margin-top:15px;
  padding:12px;
  background:#dcfce7;
  color:#166534;
  border-radius:9px;
  display:none;
}

.info{
  margin-top:12px;
  padding:12px;
  background:#eff6ff;
  color:#1e40af;
  border-radius:9px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="header">
  <h1>📚 StudySpot</h1>
  <p>Register Your Study Library</p>
</div>

<div class="container">

<div class="card">

<h2>🏫 Library Owner Registration</h2>

<label>Owner Name *</label>
<input
  type="text"
  id="ownerName"
  placeholder="Enter owner name"
>

<label>Mobile Number *</label>
<input
  type="tel"
  id="mobile"
  placeholder="Enter mobile number"
>

<label>Create Password *</label>
<input
  type="password"
  id="password"
  placeholder="Create password"
>

<label>Library Name *</label>
<input
  type="text"
  id="libraryName"
  placeholder="Enter library name"
>


<!-- STATE -->

<label>State *</label>

<select id="state">

  <option value="">
    Select State / UT
  </option>

  <option>Andhra Pradesh</option>
  <option>Arunachal Pradesh</option>
  <option>Assam</option>
  <option>Bihar</option>
  <option>Chhattisgarh</option>
  <option>Goa</option>
  <option>Gujarat</option>
  <option>Haryana</option>
  <option>Himachal Pradesh</option>
  <option>Jharkhand</option>
  <option>Karnataka</option>
  <option>Kerala</option>
  <option>Madhya Pradesh</option>
  <option>Maharashtra</option>
  <option>Manipur</option>
  <option>Meghalaya</option>
  <option>Mizoram</option>
  <option>Nagaland</option>
  <option>Odisha</option>
  <option>Punjab</option>
  <option>Rajasthan</option>
  <option>Sikkim</option>
  <option>Tamil Nadu</option>
  <option>Telangana</option>
  <option>Tripura</option>
  <option>Uttar Pradesh</option>
  <option>Uttarakhand</option>
  <option>West Bengal</option>

  <option>Andaman and Nicobar Islands</option>
  <option>Chandigarh</option>
  <option>Dadra and Nagar Haveli and Daman and Diu</option>
  <option>Delhi</option>
  <option>Jammu and Kashmir</option>
  <option>Ladakh</option>
  <option>Lakshadweep</option>
  <option>Puducherry</option>

</select>


<!-- DISTRICT -->

<label>District *</label>

<select id="district" disabled>

  <option value="">
    Pehle State Select Karein
  </option>

</select>


<!-- CITY / TOWN -->

<label>City / Town *</label>

<input
  type="text"
  id="city"
  placeholder="Apni City / Town ka naam likhein"
  disabled
>

<div class="info">
  💡 State select karne par us State ke District automatically
  aa jayenge. City/Town owner khud type karega.
</div>


<label>Library Address *</label>

<textarea
  id="address"
  placeholder="House/Shop number, Road, Area, Landmark..."
></textarea>


<label>Monthly Price (₹) *</label>

<input
  type="number"
  id="price"
  placeholder="Example: 500"
>


<label>Total Seats *</label>

<input
  type="number"
  id="seats"
  placeholder="Example: 100"
>


<label>Opening Time</label>

<input
  type="time"
  id="opening"
>


<label>Closing Time</label>

<input
  type="time"
  id="closing"
>


<label>Facilities</label>

<textarea
  id="facilities"
  placeholder="Wi-Fi, AC, CCTV, Power Backup, Silent Zone, Drinking Water..."
></textarea>


<label>Library Photo</label>

<input
  type="file"
  id="photo"
  accept="image/*"
>

<img
  id="photoPreview"
  class="photo-preview"
>


<label>Extra Information</label>

<textarea
  id="extra"
  placeholder="Library ke baare me koi extra information..."
></textarea>


<button
  class="location"
  onclick="getLocation()"
>
📍 Get Library Location
</button>

<p id="locationResult"></p>


<button
  class="register"
  onclick="registerLibrary()"
>
✅ Register My Library
</button>

<div
  id="success"
  class="success"
>
  ✅ Registration form successfully submitted!
</div>


<button
  class="back"
  onclick="window.location.href='index.html'"
>
⬅️ Back to StudySpot
</button>

</div>
</div>


<script>

/* =========================================
   STATE → DISTRICT
========================================= */

const stateSelect =
document.getElementById("state");

const districtSelect =
document.getElementById("district");

const cityInput =
document.getElementById("city");


stateSelect.addEventListener(
"change",
async function(){

  const selectedState =
  this.value;

  districtSelect.innerHTML =
  '<option value="">District load ho raha hai...</option>';

  districtSelect.disabled =
  true;

  cityInput.value =
  "";

  cityInput.disabled =
  true;


  if(!selectedState){

    districtSelect.innerHTML =
    '<option value="">Pehle State Select Karein</option>';

    return;

  }


  try{

    const response =
    await fetch(
      "https://raw.githubusercontent.com/KTBsomen/Indian-state-district-json/main/india-states-districts-latest.json"
    );


    if(!response.ok){

      throw new Error(
        "District data load nahi hua"
      );

    }


    const data =
    await response.json();


    const stateData =
    data.find(
      item =>
      item.state.trim().toLowerCase()
      ===
      selectedState.trim().toLowerCase()
    );


    districtSelect.innerHTML =
    '<option value="">Select District</option>';


    if(
      stateData &&
      Array.isArray(stateData.districts)
    ){

      stateData.districts.forEach(
        function(district){

          const option =
          document.createElement("option");

          option.value =
          district;

          option.textContent =
          district;

          districtSelect.appendChild(
            option
          );

        }
      );


      districtSelect.disabled =
      false;

    }
    else{

      districtSelect.innerHTML =
      '<option value="">District nahi mila</option>';

    }

  }
  catch(error){

    console.error(error);

    districtSelect.innerHTML =
    '<option value="">District load nahi ho paya</option>';

    alert(
      "District list load nahi ho payi. Internet connection check karein."
    );

  }

});


/* =========================================
   DISTRICT → CITY/TOWN INPUT
========================================= */

districtSelect.addEventListener(
"change",
function(){

  if(this.value){

    cityInput.disabled =
    false;

    cityInput.placeholder =
    "Apni City / Town ka naam likhein";

  }
  else{

    cityInput.disabled =
    true;

    cityInput.value =
    "";

  }

});


/* =========================================
   PHOTO PREVIEW
========================================= */

document
.getElementById("photo")
.addEventListener(
"change",
function(){

  const file =
  this.files[0];

  const preview =
  document.getElementById(
    "photoPreview"
  );


  if(file){

    const reader =
    new FileReader();


    reader.onload =
    function(e){

      preview.src =
      e.target.result;

      preview.style.display =
      "block";

    };


    reader.readAsDataURL(file);

  }
  else{

    preview.style.display =
    "none";

  }

});


/* =========================================
   GET LIBRARY LOCATION
========================================= */

function getLocation(){

  const result =
  document.getElementById(
    "locationResult"
  );


  if(!navigator.geolocation){

    result.innerHTML =
    "❌ Aapke browser me location support nahi hai.";

    return;

  }


  result.innerHTML =
  "📍 Location mil rahi hai...";


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
      position.coords.latitude;

      const lng =
      position.coords.longitude;


      result.innerHTML =
      "✅ Library location mil gayi!<br>" +
      "Latitude: " +
      lat +
      "<br>" +
      "Longitude: " +
      lng;

    },


    function(error){

      result.innerHTML =
      "❌ Location nahi mil payi.<br>" +
      "Error: " +
      error.message;

    },


    {
      enableHighAccuracy:false,
      timeout:15000,
      maximumAge:300000
    }

  );

}


/* =========================================
   REGISTER BUTTON
========================================= */

function registerLibrary(){

  const ownerName =
  document.getElementById(
    "ownerName"
  ).value.trim();


  const mobile =
  document.getElementById(
    "mobile"
  ).value.trim();


  const password =
  document.getElementById(
    "password"
  ).value;


  const libraryName =
  document.getElementById(
    "libraryName"
  ).value.trim();


  const state =
  document.getElementById(
    "state"
  ).value;


  const district =
  document.getElementById(
    "district"
  ).value;


  const city =
  document.getElementById(
    "city"
  ).value.trim();


  const address =
  document.getElementById(
    "address"
  ).value.trim();


  const price =
  document.getElementById(
    "price"
  ).value;


  const seats =
  document.getElementById(
    "seats"
  ).value;


  if(
    !ownerName ||
    !mobile ||
    !password ||
    !libraryName ||
    !state ||
    !district ||
    !city ||
    !address ||
    !price ||
    !seats
  ){

    alert(
      "Please saare required (*) fields fill karein."
    );

    return;

  }


  document.getElementById(
    "success"
  ).style.display =
  "block";


  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}

</script>

</body>
</html>
