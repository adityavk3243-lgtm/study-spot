
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Rules - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 24px auto;
    }

    .section {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #2563eb;
      font-size: 21px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
    }

    .update-button,
    .back-button {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .update-button {
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin-top: 18px;
    }

    .update-button:hover {
      background: #1d4ed8;
    }

    .back-button {
      background: #e2e8f0;
      color: #1e293b;
      margin-top: 20px;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>

  <div class="header">
    <h1>Library Rules</h1>
    <p>Add or update the rules of your library</p>
  </div>

  <div class="container">

    <div class="section">
      <h2>Library Rules and Guidelines</h2>

      <label for="libraryRules">
        Enter Library Rules
      </label>

      <textarea id="libraryRules" placeholder="Example:
1. Maintain silence inside the library.
2. Keep your mobile phone on silent mode.
3. Do not damage library property.
4. Keep your seat clean.
5. Follow the library timings."></textarea>

      <button class="update-button" id="updateButton">
        Update Library Rules
      </button>

      <div class="message" id="message">
        Library rules updated successfully in this demo.
      </div>
    </div>

    <a class="back-button" href="owner-dashboard.html">
      Back to Dashboard
    </a>

  </div>

  <script>
    const updateButton = document.getElementById("updateButton");
    const message = document.getElementById("message");

    updateButton.addEventListener("click", function () {
      message.style.display = "block";

      message.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    });
  </script>

</body>
</html>
