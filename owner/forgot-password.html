<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.09);
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand .icon {
      font-size: 42px;
    }

    .brand h1 {
      margin: 8px 0;
      font-size: 28px;
      color: #2563eb;
    }

    .brand p {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin: 0 0 12px;
      font-size: 23px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #ffffff;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .main-button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      padding: 14px;
      border-radius: 10px;
      background: #e2e8f0;
      color: #1e293b;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 360px) {
      .container {
        padding: 22px 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="brand">
      <div class="icon">📚</div>
      <h1>StudySpot</h1>
      <p>Library Owner Account Recovery</p>
    </header>

    <h2>Forgot Password?</h2>

    <p class="description">
      Enter your registered email address to receive a secure
      password reset link.
    </p>

    <form id="resetRequestForm">
      <label for="email">Registered Email Address</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      >

      <button
        type="submit"
        class="main-button"
        id="sendLinkButton"
      >
        Send Reset Link
      </button>
    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back-link" href="owner-login.html">
      ← Back to Owner Login
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <script>
    const form = document.getElementById("resetRequestForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendLinkButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      message.className = "message";

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          "Please enter your registered email address.",
          "error"
        );
        return;
      }

      if (!window.supabaseClient) {
        showMessage(
          "The recovery service is temporarily unavailable. Please try again later.",
          "error"
        );
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "Sending Link...";

      try {
        const redirectUrl = new URL(
          "reset-password.html",
          window.location.href
        ).href;

        const { error } = await window.supabaseClient.auth
          .resetPasswordForEmail(email, {
            redirectTo: redirectUrl
          });

        if (error) {
          throw error;
        }

        showMessage(
          "If an account exists for this email address, a password reset link will be sent.",
          "success"
        );
      } catch (error) {
        console.error("Password recovery request failed:", error);

        showMessage(
          "We could not process your request right now. Please try again later.",
          "error"
        );
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
