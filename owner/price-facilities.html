
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price & Facilities - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 24px auto;
    }

    .section {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .section h2 {
      margin-top: 0;
      color: #2563eb;
      font-size: 21px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .facility-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .facility {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 14px;
    }

    .facility input {
      width: auto;
    }

    .update-button {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .update-button:hover {
      background: #1d4ed8;
    }

    .back-button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #e2e8f0;
      color: #1e293b;
      padding: 13px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .facility-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 18px;
      }
    }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>

  <div class="header">
    <h1>Price & Facilities</h1>
    <p>Update your library pricing and available facilities</p>
  </div>

  <div class="container">

    <div class="section">
      <h2>Pricing Details</h2>

<div class="field">
  <label>Membership Plans</label>

  <div class="facility-grid">

    <label class="facility">
      <input
        type="checkbox"
        id="oneDayEnabled"
      >
      One Day
    </label>

    <label class="facility">
      <input
        type="checkbox"
        id="weeklyEnabled"
      >
      Weekly
    </label>

    <label class="facility">
      <input
        type="checkbox"
        id="monthlyEnabled"
      >
      Monthly
    </label>

  </div>
</div>
      
      <div class="field">
        <label for="monthlyFee">Monthly Fee (₹)</label>
        <input type="number" id="monthlyFee" placeholder="Enter monthly fee">
      </div>

      <div class="field">
        <label for="dailyFee">Daily Fee (₹)</label>
        <input type="number" id="dailyFee" placeholder="Enter daily fee">
      </div>

      <div class="field">
        <label for="weeklyFee">Weekly Fee (₹)</label>
        <input type="number" id="weeklyFee" placeholder="Enter weekly fee">
      </div>

      <div class="field">
        <label for="seatType">Seat Type</label>
        <select id="seatType">
          <option value="">Select seat type</option>
          <option>Single Seat</option>
          <option>Shared Seat</option>
          <option>Both Single and Shared</option>
        </select>
      </div>

      <div class="field">
        <label for="seatAvailability">Available Seats</label>
        <input type="number" id="seatAvailability" placeholder="Enter available seats">
      </div>
    </div>

    <div class="section">
      <h2>Library Facilities</h2>

      <div class="facility-grid">

        <label class="facility">
          <input type="checkbox" value="Wi-Fi">
          Wi-Fi
        </label>

        <label class="facility">
          <input type="checkbox" value="Air Conditioning">
          Air Conditioning
        </label>

        <label class="facility">
          <input type="checkbox" value="CCTV Security">
          CCTV Security
        </label>

        <label class="facility">
          <input type="checkbox" value="Power Backup">
          Power Backup
        </label>

        <label class="facility">
          <input type="checkbox" value="Silent Study Zone">
          Silent Study Zone
        </label>

        <label class="facility">
          <input type="checkbox" value="Drinking Water">
          Drinking Water
        </label>

        <label class="facility">
          <input type="checkbox" value="Washroom Facility">
          Washroom Facility
        </label>

        <label class="facility">
          <input type="checkbox" value="Parking Facility">
          Parking Facility
        </label>

        <label class="facility">
          <input type="checkbox" value="Charging Point">
          Charging Point
        </label>

        <label class="facility">
          <input type="checkbox" value="Locker Facility">
          Locker Facility
        </label>

        <label class="facility">
          <input type="checkbox" value="Newspaper and Magazines">
          Newspaper and Magazines
        </label>

        <label class="facility">
          <input type="checkbox" value="Personal Cabin">
          Personal Cabin
        </label>

        <label class="facility">
          <input type="checkbox" value="Fan">
          Fan
        </label>

        <label class="facility">
          <input type="checkbox" value="Proper Lighting">
          Proper Lighting
        </label>

        <label class="facility">
          <input type="checkbox" value="Biometric Entry">
          Biometric Entry
        </label>

      </div>

      <div class="field" style="margin-top: 18px;">
        <label for="otherFacilities">Other Facilities</label>
        <textarea id="otherFacilities" placeholder="Enter any other facilities"></textarea>
      </div>

      <button class="update-button" id="updateButton">
        Update Price & Facilities
      </button>

      <div class="message" id="message">
        Price and facilities updated successfully in this demo.
      </div>
    </div>

    <a class="back-button" href="owner-dashboard.html">
      Back to Dashboard
    </a>

  </div>

  <script>

      const updateButton =
    document.getElementById("updateButton");

  const message =
    document.getElementById("message");

  let currentLibrary = null;


  async function getOwnerLibrary() {

    const {
      data,
      error
    } = await window.supabaseClient.auth.getSession();

    if (error || !data.session) {

      window.location.href =
        "owner-login.html";

      return null;
    }

    const user =
      data.session.user;


    const {
      data: library,
      error: libraryError
    } = await window.supabaseClient
      .from("libraries")
      .select("*")
      .eq("owner_id", user.id)
      .maybeSingle();


    if (libraryError || !library) {

      message.textContent =
        "Your library could not be found.";

      message.style.display =
        "block";

      return null;
    }


    return library;
  }


  async function loadLibrary() {

    const library =
      await getOwnerLibrary();

    if (!library) {
      return;
    }

    currentLibrary =
      library;


    document.getElementById("oneDayEnabled").checked =
      library.daily_plan_enabled === true;

    document.getElementById("weeklyEnabled").checked =
      library.weekly_plan_enabled === true;

    document.getElementById("monthlyEnabled").checked =
      library.monthly_plan_enabled === true;


    document.getElementById("dailyFee").value =
      library.daily_fee ?? "";

    document.getElementById("weeklyFee").value =
      library.weekly_fee ?? "";

    document.getElementById("monthlyFee").value =
      library.monthly_fee ?? "";


    document.getElementById("seatType").value =
      library.seat_type ?? "";

    document.getElementById("seatAvailability").value =
      library.seat_availability ?? "";


    document.getElementById("otherFacilities").value =
      library.other_facilities ?? "";


    const facilities =
      Array.isArray(library.facilities)
        ? library.facilities
        : [];


    document
      .querySelectorAll(
        '.facility-grid input[type="checkbox"]'
      )
      .forEach(function (checkbox) {

        if (
          checkbox.id === "oneDayEnabled" ||
          checkbox.id === "weeklyEnabled" ||
          checkbox.id === "monthlyEnabled"
        ) {
          return;
        }

        checkbox.checked =
          facilities.includes(checkbox.value);

      });
  }


  updateButton.addEventListener(
    "click",
    async function () {

      if (!currentLibrary) {

        message.textContent =
          "Library information is not ready. Please refresh the page.";

        message.style.display =
          "block";

        return;
      }


      updateButton.disabled =
        true;

      updateButton.textContent =
        "Saving...";


      const facilities = [];


      document
        .querySelectorAll(
          '.facility-grid input[type="checkbox"]'
        )
        .forEach(function (checkbox) {

          if (
            checkbox.id === "oneDayEnabled" ||
            checkbox.id === "weeklyEnabled" ||
            checkbox.id === "monthlyEnabled"
          ) {
            return;
          }

          if (checkbox.checked) {
            facilities.push(checkbox.value);
          }

        });


      const dailyFee =
        document.getElementById("dailyFee").value;

      const weeklyFee =
        document.getElementById("weeklyFee").value;

      const monthlyFee =
        document.getElementById("monthlyFee").value;


      const seatAvailability =
        document.getElementById("seatAvailability").value;


      const {
        error
      } = await window.supabaseClient
        .from("libraries")
        .update({

          daily_plan_enabled:
            document.getElementById("oneDayEnabled").checked,

          weekly_plan_enabled:
            document.getElementById("weeklyEnabled").checked,

          monthly_plan_enabled:
            document.getElementById("monthlyEnabled").checked,

          daily_fee:
            dailyFee
              ? Number(dailyFee)
              : null,

          weekly_fee:
            weeklyFee
              ? Number(weeklyFee)
              : null,

          monthly_fee:
            monthlyFee
              ? Number(monthlyFee)
              : null,

          seat_type:
            document.getElementById("seatType").value || null,

          seat_availability:
            seatAvailability
              ? Number(seatAvailability)
              : null,

          facilities:
            facilities,

          other_facilities:
            document
              .getElementById("otherFacilities")
              .value
              .trim() || null

        })
        .eq("id", currentLibrary.id);


      if (error) {

        message.textContent =
          "Update failed: " + error.message;

        message.style.display =
          "block";

        message.style.background =
          "#fee2e2";

        message.style.color =
          "#991b1b";

        updateButton.disabled =
          false;

        updateButton.textContent =
          "Update Price & Facilities";

        return;
      }


      message.textContent =
        "Price, membership plans and facilities updated successfully.";

      message.style.display =
        "block";

      message.style.background =
        "#dcfce7";

      message.style.color =
        "#166534";


      updateButton.disabled =
        false;

      updateButton.textContent =
        "Update Price & Facilities";

    }
  );


  loadLibrary();

</script>

</body>
</html>
