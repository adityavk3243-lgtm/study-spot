<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #1769e0, #5546e8);
      color: white;
      padding: 24px 16px 30px;
      border-radius: 0 0 25px 25px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 29px;
    }

    .header p {
      margin: 9px 0 0;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 480px;
      margin: 24px auto;
    }

    .login-box {
      background: white;
      padding: 24px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
    }

    .description {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 22px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #d7deea;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .forgot {
      text-align: right;
      margin-top: 12px;
      font-size: 13px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .register-link {
      text-align: center;
      margin-top: 21px;
      font-size: 14px;
      line-height: 1.8;
    }

    .back-button {
      display: block;
      margin-top: 20px;
      padding: 13px;
      text-align: center;
      border-radius: 10px;
      background: #e2e8f0;
      color: #1e293b;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    @media (max-width: 380px) {
      .login-box {
        padding: 20px 15px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
</head>

<body>

  <header class="header">
    <h1>📚 StudySpot</h1>
    <p>Library Owner Login</p>
  </header>

  <main class="container">
    <section class="login-box">

      <h2>🔐 Owner Login</h2>
      <p class="description">
        Sign in to manage your library.
      </p>

      <form id="loginForm">

        <label for="loginIdentifier">
          Email Address or Mobile Number
        </label>

        <input
          type="text"
          id="loginIdentifier"
          placeholder="Enter email or mobile number"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="forgot">
          <a href="#" id="forgotPassword">Forgot Password?</a>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Login
        </button>

      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div class="register-link">
        New library owner?<br>
        <a href="owner.html">Create an Account</a>
      </div>

      <a class="back-button" href="../index.html">
        ← Back to StudySpot
      </a>

    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const identifierInput = document.getElementById("loginIdentifier");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;

      // Mobile-number login will be implemented after the website is complete.
      // For now, keep the existing Supabase email/password login working.
      const looksLikeEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier);

      if (!looksLikeEmail) {
        showMessage(
          "Mobile number login will be available after the website is complete. Please use your registered email address for now.",
          "error"
        );
        return;
      }

      const client = window.supabaseClient;

      if (!client) {
        showMessage("Supabase connection could not be loaded.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      message.style.display = "none";

      try {
        const { error } = await client.auth.signInWithPassword({
          email: identifier,
          password: password
        });

        if (error) {
          showMessage("Login failed: " + error.message, "error");
          return;
        }

        showMessage("Login successful. Redirecting...", "success");
        window.location.href = "owner-dashboard.html";

      } catch (error) {
        showMessage(
          "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", function (event) {
      event.preventDefault();
      window.location.href = "reset-password.html";
    });
  </script>

</body>
</html>
