<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Photos - StudySpot</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;padding-bottom:78px}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;position:sticky;top:0;z-index:20}
.back-btn{width:55px;height:62px;border:0;background:transparent;color:#2563eb;font-size:34px;cursor:pointer}
.header-title{flex:1;text-align:center;font-size:19px;font-weight:700;margin-right:55px}
.container{max-width:650px;margin:0 auto;padding:20px 14px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(15,23,42,.07)}
.title-row{margin-bottom:16px}
.title-row h2{margin:0;font-size:20px}
#photoCount{color:#64748b;font-size:15px;font-weight:600}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photo-card,.add-tile{position:relative;width:100%;aspect-ratio:1;border-radius:9px;overflow:hidden}
.photo-card{background:#e2e8f0}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.delete-btn{position:absolute;top:5px;right:5px;width:27px;height:27px;border:0;border-radius:50%;background:#ef4444;color:#fff;font-size:20px;font-weight:bold;cursor:pointer;z-index:3}
.add-tile{border:2px dashed #60a5fa;background:#eff6ff;color:#2563eb;display:flex;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.add-plus{display:block;font-size:34px}
.add-text{font-size:14px;font-weight:700;margin-top:4px}
.info{margin-top:14px;color:#64748b;font-size:12px;line-height:1.5}
.button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}
.camera-button{background:#0f766e;color:#fff}
.save-button{background:#2563eb;color:#fff}
.save-button:disabled{background:#94a3b8;cursor:not-allowed}
input[type=file]{display:none}
.message{display:none;margin-top:14px;padding:12px;border-radius:9px;text-align:center;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.loading{grid-column:1/-1;text-align:center;color:#64748b;padding:35px 10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;align-items:center;z-index:50}
.nav-item{text-decoration:none;color:#64748b;text-align:center;font-size:11px;font-weight:600;min-width:60px}
.nav-icon{display:block;font-size:22px;margin-bottom:3px}
.nav-item.active{color:#2563eb}
@media(max-width:420px){.container{padding:15px 12px}.card{padding:16px}.photo-grid{gap:6px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
</head>

<body>

  <div style="padding:15px 20px;">
  <a href="owner-dashboard.html"
     style="display:inline-block; padding:10px 16px; background:#2563eb; color:white; text-decoration:none; border-radius:8px; font-weight:600;">
    ← Back to Dashboard
  </a>
  </div>

<header>
  <button class="back-btn" type="button"
    onclick="window.location.href='owner-dashboard.html'">‹</button>
  <div class="header-title">Manage Photos</div>
</header>

<main class="container">
<section class="card">

  <div class="title-row">
    <h2>Library Photos <span id="photoCount">(0/15)</span></h2>
  </div>

  <input type="file" id="galleryInput"
    accept="image/jpeg,image/png,image/webp" multiple>

  <input type="file" id="cameraInput"
    accept="image/jpeg,image/png,image/webp" capture="environment">

  <div class="photo-grid" id="photoGrid">
    <div class="loading">Loading library photos...</div>
  </div>

  <div class="info">
    Upload up to 15 photos. Supported formats: JPG, PNG and WEBP.
    Each library's new photos are stored in its own folder.
  </div>

  <button type="button" class="button camera-button" id="cameraButton">
    📷 Take Photo
  </button>

  <button type="button" class="button save-button" id="saveButton" disabled>
    Save Changes
  </button>

  <div class="message" id="message" role="status"></div>

</section>
</main>

<nav class="bottom-nav">
  <a class="nav-item" href="owner-dashboard.html">
    <span class="nav-icon">⌂</span>Home
  </a>
  <a class="nav-item" href="owner-dashboard.html">
    <span class="nav-icon">♟</span>Students
  </a>
  <a class="nav-item active" href="edit-library.html">
    <span class="nav-icon">▣</span>Library
  </a>
  <a class="nav-item" href="owner-dashboard.html">
    <span class="nav-icon">♙</span>Profile
  </a>
</nav>

<script>
"use strict";

/* SETTINGS */

const client = supabaseClient;
const PHOTO_BUCKET = "StudySpot library-photos";
const MAX_PHOTOS = 15;

const galleryInput = document.getElementById("galleryInput");
const cameraInput = document.getElementById("cameraInput");
const cameraButton = document.getElementById("cameraButton");
const photoGrid = document.getElementById("photoGrid");
const photoCount = document.getElementById("photoCount");
const saveButton = document.getElementById("saveButton");
const message = document.getElementById("message");

let ownerId = null;
let libraryId = null;
let savedPhotos = [];
let originalPhotoUrls = [];
let newFiles = [];
let photosChanged = false;
let isSaving = false;


/* MESSAGES */

function showMessage(text, success = true) {
  message.style.display = "block";
  message.textContent = text;
  message.style.background = success ? "#dcfce7" : "#fee2e2";
  message.style.color = success ? "#166534" : "#991b1b";
}

function hideMessage() {
  message.style.display = "none";
}


/* URL TO STORAGE PATH */

function storagePathFromPublicUrl(url) {
  try {
    const parsed = new URL(url);
    const marker =
      "/storage/v1/object/public/" + PHOTO_BUCKET + "/";

    let index = parsed.pathname.indexOf(marker);

    if (index < 0) return null;

    const encodedPath = parsed.pathname.slice(index + marker.length);
    const path = decodeURIComponent(encodedPath);

    if (!path || path.split("/").some(part => part === "..")) {
      return null;
    }

    return path;
  } catch (error) {
    return null;
  }
}


/* COUNT */

function updateCount() {
  const total = savedPhotos.length + newFiles.length;

  photoCount.textContent = `(${total}/${MAX_PHOTOS})`;
  saveButton.disabled = !photosChanged || isSaving;
}


/* RENDER */

function renderPhotos() {
  photoGrid.innerHTML = "";

  savedPhotos.forEach((photo, index) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const image = document.createElement("img");
    image.src = photo.url;
    image.alt = "Library photo";

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-btn";
    deleteButton.textContent = "×";
    deleteButton.setAttribute("aria-label", "Remove photo");

    deleteButton.addEventListener("click", () => {
      if (isSaving) return;

      savedPhotos.splice(index, 1);
      photosChanged = true;
      hideMessage();
      renderPhotos();
    });

    card.appendChild(image);
    card.appendChild(deleteButton);
    photoGrid.appendChild(card);
  });

  newFiles.forEach((file, index) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const image = document.createElement("img");
    image.alt = "New library photo";

    const reader = new FileReader();
    reader.onload = event => {
      image.src = event.target.result;
    };
    reader.readAsDataURL(file);

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-btn";
    deleteButton.textContent = "×";

    deleteButton.addEventListener("click", () => {
      if (isSaving) return;

      newFiles.splice(index, 1);
      photosChanged = true;
      renderPhotos();
    });

    card.appendChild(image);
    card.appendChild(deleteButton);
    photoGrid.appendChild(card);
  });

  if (savedPhotos.length + newFiles.length < MAX_PHOTOS) {
    const addTile = document.createElement("label");
    addTile.className = "add-tile";
    addTile.htmlFor = "galleryInput";

    addTile.innerHTML = `
      <div>
        <span class="add-plus">＋</span>
        <div class="add-text">Add Photos</div>
      </div>
    `;

    photoGrid.appendChild(addTile);
  }

  updateCount();
}


/* LOAD LIBRARY */

async function loadLibrary() {
  try {
    if (!client) {
      throw new Error("Supabase client is not configured.");
    }

    const {
      data: { user },
      error: userError
    } = await client.auth.getUser();

    if (userError || !user) {
      window.location.href = "owner-login.html";
      return;
    }

    ownerId = user.id;

    const {
      data: library,
      error: libraryError
    } = await client
      .from("libraries")
      .select("id, photos")
      .eq("owner_id", ownerId)
      .maybeSingle();

    if (libraryError) throw libraryError;

    if (!library) {
      throw new Error("Your library could not be found.");
    }

    libraryId = library.id;

    const urls = Array.isArray(library.photos)
      ? library.photos.filter(
          url => typeof url === "string" && url.trim() !== ""
        )
      : [];

    if (urls.length > MAX_PHOTOS) {
      throw new Error(
        "More than 15 photo links are saved in the database. No changes were made. Please review these records first."
      );
    }

    originalPhotoUrls = [...urls];

    savedPhotos = urls.map(url => ({
      url,
      path: storagePathFromPublicUrl(url)
    }));

    newFiles = [];
    photosChanged = false;

    renderPhotos();
    hideMessage();

  } catch (error) {
    console.error("Manage Photos loading error:", error);
    photoGrid.innerHTML = "";
    updateCount();

    showMessage(
      "Could not load library photos: " +
      (error.message || "Unknown error"),
      false
    );
  }
}


/* ADD PHOTOS */

function addPhotos(fileList) {
  if (isSaving) return;

  const incoming = Array.from(fileList || []);
  const remaining =
    MAX_PHOTOS - savedPhotos.length - newFiles.length;

  if (remaining <= 0) {
    showMessage("You can upload a maximum of 15 photos.", false);
    return;
  }

  const valid = incoming.filter(file =>
    ["image/jpeg", "image/png", "image/webp"].includes(file.type)
  );

  if (valid.length === 0 && incoming.length > 0) {
    showMessage("Choose JPG, PNG or WEBP image files.", false);
    return;
  }

  newFiles = newFiles.concat(valid.slice(0, remaining));
  photosChanged = true;

  hideMessage();
  renderPhotos();

  if (valid.length > remaining) {
    showMessage(
      `Only ${remaining} photo(s) were added because the limit is 15.`,
      false
    );
  }
}

galleryInput.addEventListener("change", () => {
  addPhotos(galleryInput.files);
  galleryInput.value = "";
});

cameraButton.addEventListener("click", () => {
  cameraInput.click();
});

cameraInput.addEventListener("change", () => {
  addPhotos(cameraInput.files);
  cameraInput.value = "";
});


/* UPLOAD NEW PHOTO */

async function uploadPhoto(file) {
  const extension =
    (file.name.split(".").pop() || "jpg")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "") || "jpg";

  const fileName =
    `${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const filePath = `${ownerId}/${libraryId}/${fileName}`;

  const { error } = await client.storage
    .from(PHOTO_BUCKET)
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = client.storage
    .from(PHOTO_BUCKET)
    .getPublicUrl(filePath);

  return {
    url: data.publicUrl,
    path: filePath
  };
}


/* SAFE STORAGE CLEANUP */

async function removeUnreferencedStorageFiles(removedUrls) {
  const candidatePaths = [
    ...new Set(
      removedUrls
        .map(storagePathFromPublicUrl)
        .filter(Boolean)
    )
  ];

  if (candidatePaths.length === 0) {
    return { removed: 0, failed: 0, skipped: 0 };
  }

  /*
    Read every library's current photo URLs before removing anything.
    This protects files that are still used by another library.
  */

  const {
    data: allLibraries,
    error: readError
  } = await client
    .from("libraries")
    .select("photos");

  if (readError) {
    console.error("Could not verify photo references:", readError);
    return {
      removed: 0,
      failed: candidatePaths.length,
      skipped: 0
    };
  }

  const usedPaths = new Set();

  (allLibraries || []).forEach(library => {
    const urls = Array.isArray(library.photos)
      ? library.photos
      : [];

    urls.forEach(url => {
      if (typeof url !== "string") return;

      const path = storagePathFromPublicUrl(url);
      if (path) usedPaths.add(path);
    });
  });

  const safePaths = candidatePaths.filter(
    path => !usedPaths.has(path)
  );

  if (safePaths.length === 0) {
    return {
      removed: 0,
      failed: 0,
      skipped: candidatePaths.length
    };
  }

  const { data, error: removeError } = await client.storage
    .from(PHOTO_BUCKET)
    .remove(safePaths);

  if (removeError) {
    console.error("Storage deletion failed:", removeError);

    return {
      removed: 0,
      failed: safePaths.length,
      skipped: candidatePaths.length - safePaths.length
    };
  }

  return {
    removed: Array.isArray(data) ? data.length : safePaths.length,
    failed: 0,
    skipped: candidatePaths.length - safePaths.length
  };
}


/* SAVE CHANGES */

saveButton.addEventListener("click", async () => {
  if (isSaving) return;

  const total = savedPhotos.length + newFiles.length;

  if (total > MAX_PHOTOS) {
    showMessage("You can save a maximum of 15 photos.", false);
    return;
  }

  isSaving = true;
  saveButton.textContent = "Saving Photos...";
  updateCount();

  let uploadedPhotos = [];

  try {
    for (const file of newFiles) {
      uploadedPhotos.push(await uploadPhoto(file));
    }

    const finalPhotos = savedPhotos.concat(uploadedPhotos);
    const finalUrls = finalPhotos.map(photo => photo.url);

    /*
      Save the new photo list first.
      Do not delete Storage files before this succeeds.
    */

    const {
      data: updatedRows,
      error: updateError
    } = await client
      .from("libraries")
      .update({ photos: finalUrls })
      .eq("id", libraryId)
      .eq("owner_id", ownerId)
      .select("id");

    if (updateError) throw updateError;

    if (!updatedRows || updatedRows.length !== 1) {
      throw new Error(
        "Database update was not confirmed. Reload and check before retrying."
      );
    }

    const finalUrlSet = new Set(finalUrls);

    const removedUrls = originalPhotoUrls.filter(
      url => !finalUrlSet.has(url)
    );

    originalPhotoUrls = [...finalUrls];
    savedPhotos = finalPhotos;
    newFiles = [];
    photosChanged = false;

    renderPhotos();

    /*
      Cleanup happens only after the database update succeeds.
    */

    const cleanup = await removeUnreferencedStorageFiles(removedUrls);

    if (cleanup.failed > 0) {
      showMessage(
        "Photo list saved, but Storage could not delete " +
        cleanup.failed +
        " file(s). Check the DELETE policy and browser console.",
        false
      );
    } else if (cleanup.skipped > 0) {
      showMessage(
        "Photo list saved. Some files were kept because they are still referenced by a library."
      );
    } else {
      showMessage("Library photos saved successfully.");
    }

  } catch (error) {
    console.error("Photo save error:", error);

    /*
      If upload succeeded but the database update failed,
      uploaded files may remain in Storage. Do not delete
      them automatically because the result may be uncertain.
    */

    showMessage(
      "Photos could not be fully saved: " +
      (error.message || "Unknown error") +
      ". Check the photo list before retrying.",
      false
    );

  } finally {
    isSaving = false;
    saveButton.textContent = "Save Changes";
    updateCount();
  }
});


/* START */

loadLibrary();
</script>
</body>
</html>
