<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Photos - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      padding-bottom: 78px;
    }

    /* HEADER */

    header {
      height: 62px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      width: 55px;
      height: 62px;
      border: 0;
      background: transparent;
      color: #2563eb;
      font-size: 34px;
      cursor: pointer;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
      margin-right: 55px;
    }

    /* MAIN */

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.07);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title-row h2 {
      margin: 0;
      font-size: 20px;
      color: #172033;
    }

    #photoCount {
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
    }

    /* PHOTO GRID */

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .photo-card,
    .add-tile {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 9px;
      overflow: hidden;
    }

    .photo-card {
      background: #e2e8f0;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .delete-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 27px;
      height: 27px;
      border: 0;
      border-radius: 50%;
      background: #ef4444;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      line-height: 25px;
      padding: 0;
      cursor: pointer;
      z-index: 3;
    }

    .add-tile {
      border: 2px dashed #60a5fa;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
    }

    .add-plus {
      display: block;
      font-size: 34px;
      line-height: 34px;
    }

    .add-text {
      font-size: 14px;
      font-weight: 700;
      margin-top: 4px;
    }

    /* INFO */

    .info {
      margin-top: 14px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    /* BUTTONS */

    .button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .camera-button {
      background: #0f766e;
      color: white;
    }

    .save-button {
      background: #2563eb;
      color: white;
    }

    .save-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    input[type="file"] {
      display: none;
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    /* LOADING */

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 35px 10px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      box-shadow: 0 -3px 12px rgba(15, 23, 42, 0.08);
    }

    .nav-item {
      text-decoration: none;
      color: #64748b;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      min-width: 60px;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #2563eb;
    }

    @media (max-width: 420px) {
      .container {
        padding: 15px 12px;
      }

      .card {
        padding: 16px;
      }

      .photo-grid {
        gap: 6px;
      }

      .delete-btn {
        width: 24px;
        height: 24px;
        font-size: 18px;
        line-height: 23px;
      }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
</head>

<body>

  <!-- HEADER -->

  <header>
    <button
      class="back-btn"
      type="button"
      onclick="history.back()"
    >
      ‹
    </button>

    <div class="header-title">
      Manage Photos
    </div>
  </header>


  <!-- MAIN -->

  <main class="container">

    <section class="card">

      <div class="title-row">
        <h2>
          Library Photos
          <span id="photoCount">(0/15)</span>
        </h2>
      </div>


      <!-- Gallery -->

      <input
        type="file"
        id="galleryInput"
        accept="image/jpeg,image/png,image/webp"
        multiple
      >


      <!-- Camera -->

      <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
      >


      <!-- PHOTO GRID -->

      <div
        class="photo-grid"
        id="photoGrid"
      >
        <div class="loading">
          Loading library photos...
        </div>
      </div>


      <div class="info">
        You can upload up to 15 photos. Supported formats:
        JPG, PNG and WEBP. Each photo should be clear and
        related to your library.
      </div>


      <!-- CAMERA -->

      <button
        type="button"
        class="button camera-button"
        id="cameraButton"
      >
        📷 Take Photo
      </button>


      <!-- SAVE -->

      <button
        type="button"
        class="button save-button"
        id="saveButton"
        disabled
      >
        Save Changes
      </button>


      <div
        class="message"
        id="message"
      ></div>

    </section>

  </main>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">

    <a
      class="nav-item"
      href="owner-dashboard.html"
    >
      <span class="nav-icon">⌂</span>
      Home
    </a>

    <a
      class="nav-item"
      href="owner-dashboard.html"
    >
      <span class="nav-icon">♟</span>
      Students
    </a>

    <a
      class="nav-item active"
      href="edit-library.html"
    >
      <span class="nav-icon">▣</span>
      Library
    </a>

    <a
      class="nav-item"
      href="owner-dashboard.html"
    >
      <span class="nav-icon">♙</span>
      Profile
    </a>

  </nav>


  <script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const galleryInput =
      document.getElementById("galleryInput");

    const cameraInput =
      document.getElementById("cameraInput");

    const cameraButton =
      document.getElementById("cameraButton");

    const photoGrid =
      document.getElementById("photoGrid");

    const photoCount =
      document.getElementById("photoCount");

    const saveButton =
      document.getElementById("saveButton");

    const message =
      document.getElementById("message");


    /* =========================================
       IMPORTANT
       Exact bucket name from Supabase
    ========================================= */

    const PHOTO_BUCKET =
      "StudySpot library-photos";


    /* =========================================
       STATE
    ========================================= */

    let ownerId = null;

    let libraryId = null;

    let savedPhotos = [];

    let newFiles = [];

    let photosChanged = false;


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
      text,
      success = true
    ) {

      message.style.display =
        "block";

      message.textContent =
        text;

      if (success) {

        message.style.background =
          "#dcfce7";

        message.style.color =
          "#166534";

      } else {

        message.style.background =
          "#fee2e2";

        message.style.color =
          "#991b1b";
      }
    }


    /* =========================================
       HIDE MESSAGE
    ========================================= */

    function hideMessage() {

      message.style.display =
        "none";

    }


    /* =========================================
       COUNT
    ========================================= */

    function updateCount() {

      const total =
        savedPhotos.length +
        newFiles.length;

      photoCount.textContent =
        `(${total}/15)`;

      saveButton.disabled =
        !photosChanged;

    }


    /* =========================================
       RENDER
    ========================================= */

    function renderPhotos() {

      photoGrid.innerHTML =
        "";

      const total =
        savedPhotos.length +
        newFiles.length;


      /* SAVED PHOTOS */

      savedPhotos.forEach(
        function(photo, index) {

          const card =
            document.createElement("div");

          card.className =
            "photo-card";


          const image =
            document.createElement("img");

          image.src =
            photo.url;

          image.alt =
            "Library photo";


          const deleteButton =
            document.createElement("button");

          deleteButton.type =
            "button";

          deleteButton.className =
            "delete-btn";

          deleteButton.textContent =
            "×";


          deleteButton.addEventListener(
            "click",
            function() {

              savedPhotos.splice(
                index,
                1
              );

              photosChanged =
                true;

              renderPhotos();

            }
          );


          card.appendChild(
            image
          );

          card.appendChild(
            deleteButton
          );

          photoGrid.appendChild(
            card
          );

        }
      );


      /* NEW PHOTOS */

      newFiles.forEach(
        function(file, index) {

          const card =
            document.createElement("div");

          card.className =
            "photo-card";


          const image =
            document.createElement("img");

          image.alt =
            "New library photo";


          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              image.src =
                event.target.result;

            };


          reader.readAsDataURL(
            file
          );


          const deleteButton =
            document.createElement("button");

          deleteButton.type =
            "button";

          deleteButton.className =
            "delete-btn";

          deleteButton.textContent =
            "×";


          deleteButton.addEventListener(
            "click",
            function() {

              newFiles.splice(
                index,
                1
              );

              photosChanged =
                true;

              renderPhotos();

            }
          );


          card.appendChild(
            image
          );

          card.appendChild(
            deleteButton
          );

          photoGrid.appendChild(
            card
          );

        }
      );


      /* ADD PHOTOS TILE */

      if (total < 15) {

        const addTile =
          document.createElement("label");

        addTile.className =
          "add-tile";

        addTile.setAttribute(
          "for",
          "galleryInput"
        );

        addTile.innerHTML = `
          <div>
            <span class="add-plus">＋</span>
            <div class="add-text">
              Add Photos
            </div>
          </div>
        `;

        photoGrid.appendChild(
          addTile
        );

      }


      updateCount();

    }


    /* =========================================
       LOAD PHOTOS FROM STORAGE
    ========================================= */

    async function loadPhotosFromStorage() {

      try {

        const {
          data: files,
          error
        } =
          await client.storage
            .from(
              PHOTO_BUCKET
            )
            .list(
              ownerId,
              {
                limit: 100,
                offset: 0,
                sortBy: {
                  column: "created_at",
                  order: "asc"
                }
              }
            );


        if (error) {

          console.error(
            "Storage photo loading error:",
            error
          );

          showMessage(
            "Photos could not be loaded: " +
            error.message,
            false
          );

          photoGrid.innerHTML = "";

          updateCount();

          return;

        }


        savedPhotos =
          [];


        if (
          Array.isArray(files)
        ) {

          files
            .filter(
              function(file) {

                return (
                  file.name &&
                  file.name !== ".emptyFolderPlaceholder"
                );

              }
            )
            .slice(0, 15)
            .forEach(
              function(file) {

                const filePath =
                  `${ownerId}/${file.name}`;

                const {
                  data
                } =
                  client.storage
                    .from(
                      PHOTO_BUCKET
                    )
                    .getPublicUrl(
                      filePath
                    );


                savedPhotos.push({
                  name:
                    file.name,

                  path:
                    filePath,

                  url:
                    data.publicUrl
                });

              }
            );

        }


        renderPhotos();


        if (
          savedPhotos.length > 0
        ) {

          showMessage(
            "Photos loaded successfully."
          );

        } else {

          hideMessage();

        }


      } catch (error) {

        console.error(
          "Photo loading exception:",
          error
        );

        showMessage(
          "Photos could not be loaded.",
          false
        );

      }

    }


    /* =========================================
       LOAD OWNER + LIBRARY
    ========================================= */

    async function loadLibrary() {

      try {

        const {
          data: {
            user
          },
          error: userError
        } =
          await client.auth.getUser();


        if (
          userError ||
          !user
        ) {

          alert(
            "Please login as a library owner."
          );

          window.location.href =
            "owner-login.html";

          return;

        }


        ownerId =
          user.id;


        const {
          data: library,
          error: libraryError
        } =
          await client
            .from("libraries")
            .select("id")
            .eq(
              "owner_id",
              ownerId
            )
            .maybeSingle();


        if (libraryError) {

          console.error(
            "Library loading error:",
            libraryError
          );

          showMessage(
            "Library could not be loaded: " +
            libraryError.message,
            false
          );

          return;

        }


        if (!library) {

          showMessage(
            "Your library could not be found.",
            false
          );

          return;

        }


        libraryId =
          library.id;


        await loadPhotosFromStorage();


      } catch (error) {

        console.error(
          "Manage Photos error:",
          error
        );

        showMessage(
          "Something went wrong while loading photos: " +
          (error.message || "Unknown error"),
          false
        );

      }

    }


    /* =========================================
       ADD PHOTOS
    ========================================= */

    function addPhotos(files) {

      const incoming =
        Array.from(files);

      const currentTotal =
        savedPhotos.length +
        newFiles.length;

      const remaining =
        15 - currentTotal;


      if (
        remaining <= 0
      ) {

        showMessage(
          "You can upload a maximum of 15 photos.",
          false
        );

        return;

      }


      const selected =
        incoming.slice(
          0,
          remaining
        );


      newFiles =
        newFiles.concat(
          selected
        );


      photosChanged =
        true;


      if (
        incoming.length >
        remaining
      ) {

        showMessage(
          "Only 15 photos can be added in total.",
          false
        );

      } else {

        hideMessage();

      }


      renderPhotos();

    }


    /* =========================================
       GALLERY
    ========================================= */

    galleryInput.addEventListener(
      "change",
      function() {

        addPhotos(
          galleryInput.files
        );

        galleryInput.value =
          "";

      }
    );


    /* =========================================
       CAMERA
    ========================================= */

    cameraButton.addEventListener(
      "click",
      function() {

        cameraInput.click();

      }
    );


    cameraInput.addEventListener(
      "change",
      function() {

        addPhotos(
          cameraInput.files
        );

        cameraInput.value =
          "";

      }
    );


    /* =========================================
       UPLOAD ONE PHOTO
    ========================================= */

    async function uploadPhoto(
      file
    ) {

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const fileName =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const filePath =
        `${ownerId}/${fileName}`;


      const {
        error
      } =
        await client.storage
          .from(
            PHOTO_BUCKET
          )
          .upload(
            filePath,
            file,
            {
              cacheControl:
                "3600",

              upsert:
                false,

              contentType:
                file.type
            }
          );


      if (error) {

        throw error;

      }


      const {
        data
      } =
        client.storage
          .from(
            PHOTO_BUCKET
          )
          .getPublicUrl(
            filePath
          );


      return {
        name:
          fileName,

        path:
          filePath,

        url:
          data.publicUrl
      };

    }


    /* =========================================
       SAVE CHANGES
    ========================================= */

    saveButton.addEventListener(
      "click",
      async function() {

        const total =
          savedPhotos.length +
          newFiles.length;


        if (
          total > 15
        ) {

          showMessage(
            "You can save a maximum of 15 photos.",
            false
          );

          return;

        }


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Saving Photos...";


        try {

          const uploadedPhotos =
            [];


          /* Upload new photos */

          for (
            const file
            of newFiles
          ) {

            const uploaded =
              await uploadPhoto(
                file
              );

            uploadedPhotos.push(
              uploaded
            );

          }


          const finalPhotos =
            savedPhotos.concat(
              uploadedPhotos
            );


          /*
             Save URLs to libraries.photos
             if the column exists.
          */

          const photoUrls =
            finalPhotos.map(
              function(photo) {
                return photo.url;
              }
            );


          const {
            error: updateError
          } =
            await client
              .from("libraries")
              .update({
                photos:
                  photoUrls
              })
              .eq(
                "id",
                libraryId
              )
              .eq(
                "owner_id",
                ownerId
              );


          if (updateError) {

            throw updateError;

          }


          savedPhotos =
            finalPhotos;

          newFiles =
            [];

          photosChanged =
            false;


          renderPhotos();


          showMessage(
            "Library photos saved successfully."
          );


        } catch (error) {

          console.error(
            "Photo save error:",
            error
          );


          showMessage(
            "Photos could not be saved: " +
            (error.message || "Unknown error"),
            false
          );


        } finally {

          saveButton.textContent =
            "Save Changes";

          updateCount();

        }

      }
    );


    /* =========================================
       START
    ========================================= */

    loadLibrary();

  </script>

</body>
</html>
