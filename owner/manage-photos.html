<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Photos - StudySpot</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;padding-bottom:85px}
header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;position:sticky;top:0;z-index:20}
.back-btn{width:55px;height:62px;border:0;background:transparent;color:#2563eb;font-size:34px;cursor:pointer}
.header-title{flex:1;text-align:center;font-size:19px;font-weight:700;margin-right:55px}
.container{max-width:650px;margin:0 auto;padding:20px 14px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(15,23,42,.07)}
.title-row{margin-bottom:16px}
.title-row h2{margin:0;font-size:20px}
#photoCount{color:#64748b;font-size:15px;font-weight:600}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.photo-card,.add-tile{position:relative;width:100%;aspect-ratio:1;border-radius:9px;overflow:hidden}
.photo-card{background:#e2e8f0}
.photo-card img{width:100%;height:100%;object-fit:cover;display:block}
.delete-btn{position:absolute;top:5px;right:5px;width:28px;height:28px;border:0;border-radius:50%;background:#ef4444;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
.add-tile{border:2px dashed #60a5fa;background:#eff6ff;color:#2563eb;display:flex;justify-content:center;align-items:center;text-align:center;cursor:pointer}
.add-plus{display:block;font-size:34px}
.add-text{font-size:14px;font-weight:700;margin-top:4px}
.info{margin-top:14px;color:#64748b;font-size:12px;line-height:1.5}
.button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:15px;font-size:16px;font-weight:700;cursor:pointer}
.camera-button{background:#0f766e;color:#fff}
.save-button{background:#2563eb;color:#fff}
.save-button:disabled{background:#94a3b8;cursor:not-allowed}
input[type=file]{display:none}
.message{display:none;margin-top:14px;padding:12px;border-radius:9px;text-align:center;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.loading{grid-column:1/-1;text-align:center;color:#64748b;padding:35px 10px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;align-items:center;z-index:50}
.nav-item{text-decoration:none;color:#64748b;text-align:center;font-size:11px;font-weight:600;min-width:60px}
.nav-icon{display:block;font-size:22px;margin-bottom:3px}
.nav-item.active{color:#2563eb}
@media(max-width:420px){.container{padding:15px 12px}.card{padding:16px}.photo-grid{gap:6px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
</head>

<body>
<header>
  <button class="back-btn" type="button" onclick="location.href='owner-dashboard.html'">‹</button>
  <div class="header-title">Manage Photos</div>
</header>

<main class="container">
<section class="card">
  <div class="title-row">
    <h2>Library Photos <span id="photoCount">(0/15)</span></h2>
  </div>

  <input type="file" id="galleryInput" accept="image/jpeg,image/png,image/webp" multiple>
  <input type="file" id="cameraInput" accept="image/jpeg,image/png,image/webp" capture="environment">

  <div class="photo-grid" id="photoGrid">
    <div class="loading">Loading library photos...</div>
  </div>

  <div class="info">
    Upload up to 15 photos. Supported formats: JPG, PNG and WEBP.
  </div>

  <button type="button" class="button camera-button" id="cameraButton">📷 Take Photo</button>
  <button type="button" class="button save-button" id="saveButton" disabled>Save Changes</button>
  <div class="message" id="message" role="status"></div>
</section>
</main>

<nav class="bottom-nav">
  <a class="nav-item" href="owner-dashboard.html"><span class="nav-icon">⌂</span>Home</a>
  <a class="nav-item" href="owner-dashboard.html"><span class="nav-icon">♟</span>Students</a>
  <a class="nav-item active" href="edit-library.html"><span class="nav-icon">▣</span>Library</a>
  <a class="nav-item" href="owner-dashboard.html"><span class="nav-icon">♙</span>Profile</a>
</nav>

<div style="padding:0 20px 25px;text-align:center">
  <a href="owner-dashboard.html" style="display:block;padding:16px;background:#e2e8f0;color:#1e293b;text-decoration:none;border-radius:12px;font-size:18px;font-weight:700">Back to Dashboard</a>
</div>

<script>
"use strict";

const client = supabaseClient;
const PHOTO_BUCKET = "StudySpot library-photos";
const MAX_PHOTOS = 15;

const galleryInput = document.getElementById("galleryInput");
const cameraInput = document.getElementById("cameraInput");
const cameraButton = document.getElementById("cameraButton");
const photoGrid = document.getElementById("photoGrid");
const photoCount = document.getElementById("photoCount");
const saveButton = document.getElementById("saveButton");
const message = document.getElementById("message");

let ownerId = null;
let libraryId = null;
let savedPhotos = [];
let originalPhotoUrls = [];
let newFiles = [];
let photosChanged = false;
let isSaving = false;

function showMessage(text, success = true) {
  message.style.display = "block";
  message.textContent = text;
  message.style.background = success ? "#dcfce7" : "#fee2e2";
  message.style.color = success ? "#166534" : "#991b1b";
}

function hideMessage() {
  message.style.display = "none";
}

function storagePathFromPublicUrl(url) {
  try {
    const parsed = new URL(url);
    const marker = "/storage/v1/object/public/";
    const index = parsed.pathname.indexOf(marker);

    if (index === -1) return null;

    const afterMarker = parsed.pathname.slice(index + marker.length);
    const slashIndex = afterMarker.indexOf("/");

    if (slashIndex === -1) return null;

    const bucket = decodeURIComponent(
      afterMarker.slice(0, slashIndex)
    );

    if (bucket !== PHOTO_BUCKET) return null;

    return decodeURIComponent(
      afterMarker.slice(slashIndex + 1)
    );
  } catch (error) {
    console.error("Storage path error:", error);
    return null;
  }
}

function updateCount() {
  photoCount.textContent = `(${savedPhotos.length + newFiles.length}/${MAX_PHOTOS})`;
  saveButton.disabled = !photosChanged || isSaving;
}

function renderPhotos() {
  photoGrid.innerHTML = "";

  savedPhotos.forEach((photo, index) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.src = photo.url;
    img.alt = "Library photo";

    const del = document.createElement("button");
    del.type = "button";
    del.className = "delete-btn";
    del.textContent = "×";
    del.setAttribute("aria-label", "Remove photo");

    del.addEventListener("click", () => {
      if (isSaving) return;
      savedPhotos.splice(index, 1);
      photosChanged = true;
      hideMessage();
      renderPhotos();
    });

    card.append(img, del);
    photoGrid.appendChild(card);
  });

  newFiles.forEach((file, index) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const img = document.createElement("img");
    img.alt = "New library photo";

    const reader = new FileReader();
    reader.onload = event => { img.src = event.target.result; };
    reader.readAsDataURL(file);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "delete-btn";
    del.textContent = "×";
    del.addEventListener("click", () => {
      if (isSaving) return;
      newFiles.splice(index, 1);
      photosChanged = true;
      renderPhotos();
    });

    card.append(img, del);
    photoGrid.appendChild(card);
  });

  if (savedPhotos.length + newFiles.length < MAX_PHOTOS) {
    const tile = document.createElement("label");
    tile.className = "add-tile";
    tile.htmlFor = "galleryInput";
    tile.innerHTML = '<div><span class="add-plus">＋</span><div class="add-text">Add Photos</div></div>';
    photoGrid.appendChild(tile);
  }

  updateCount();
}

async function loadLibrary() {
  try {
    if (!client) throw new Error("Supabase client is not configured.");

    const { data: authData, error: authError } = await client.auth.getUser();
    if (authError || !authData.user) {
      location.href = "owner-login.html";
      return;
    }

    ownerId = authData.user.id;

    const { data: library, error } = await client
      .from("libraries")
      .select("id, photos")
      .eq("owner_id", ownerId)
      .maybeSingle();

    if (error) throw error;
    if (!library) throw new Error("Your library could not be found.");

    libraryId = library.id;

    const urls = Array.isArray(library.photos)
      ? library.photos.filter(url => typeof url === "string" && url.trim())
      : [];

    if (urls.length > MAX_PHOTOS) {
      throw new Error("More than 15 photo URLs are saved. No changes were made.");
    }

    originalPhotoUrls = [...urls];
    savedPhotos = urls.map(url => ({ url, path: storagePathFromPublicUrl(url) }));
    newFiles = [];
    photosChanged = false;

    renderPhotos();
    hideMessage();
  } catch (error) {
    console.error("Load photos error:", error);
    photoGrid.innerHTML = "";
    showMessage("Could not load photos: " + (error.message || "Unknown error"), false);
  }
}

function addPhotos(fileList) {
  if (isSaving) return;

  const incoming = Array.from(fileList || []);
  const remaining = MAX_PHOTOS - savedPhotos.length - newFiles.length;

  if (remaining <= 0) {
    showMessage("You can upload a maximum of 15 photos.", false);
    return;
  }

  const valid = incoming.filter(file =>
    ["image/jpeg", "image/png", "image/webp"].includes(file.type)
  );

  if (!valid.length && incoming.length) {
    showMessage("Choose JPG, PNG or WEBP images.", false);
    return;
  }

  newFiles = newFiles.concat(valid.slice(0, remaining));
  photosChanged = true;
  hideMessage();
  renderPhotos();

  if (valid.length > remaining) {
    showMessage(`Only ${remaining} photo(s) were added because the limit is 15.`, false);
  }
}

galleryInput.addEventListener("change", () => {
  addPhotos(galleryInput.files);
  galleryInput.value = "";
});

cameraButton.addEventListener("click", () => cameraInput.click());

cameraInput.addEventListener("change", () => {
  addPhotos(cameraInput.files);
  cameraInput.value = "";
});

async function uploadPhoto(file) {
  const extension = (file.name.split(".").pop() || "jpg")
    .toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";

  const filePath = `${ownerId}/${libraryId}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const { error } = await client.storage
    .from(PHOTO_BUCKET)
    .upload(filePath, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = client.storage.from(PHOTO_BUCKET).getPublicUrl(filePath);
  return { url: data.publicUrl, path: filePath };
}

async function removeUnreferencedStorageFiles(removedUrls) {
  const candidatePaths = [...new Set(removedUrls.map(storagePathFromPublicUrl).filter(Boolean))];

  if (!candidatePaths.length) {
    return { removed: 0, failed: 0, skipped: 0, details: "No valid Storage paths were found." };
  }

  const { data: allLibraries, error: readError } = await client
    .from("libraries")
    .select("photos");

  if (readError) {
    return { removed: 0, failed: candidatePaths.length, skipped: 0, details: "Could not check database references: " + readError.message };
  }

  const usedPaths = new Set();

  (allLibraries || []).forEach(library => {
    const urls = Array.isArray(library.photos) ? library.photos : [];
    urls.forEach(url => {
      if (typeof url !== "string") return;
      const path = storagePathFromPublicUrl(url);
      if (path) usedPaths.add(path);
    });
  });

  const safePaths = candidatePaths.filter(path => !usedPaths.has(path));

  if (!safePaths.length) {
    return {
      removed: 0,
      failed: 0,
      skipped: candidatePaths.length,
      details: "The deleted URL is still referenced in the database."
    };
  }

  const { data, error: removeError } = await client.storage
    .from(PHOTO_BUCKET)
    .remove(safePaths);

  if (removeError) {
    console.error("Storage deletion error:", removeError);
    return {
      removed: 0,
      failed: safePaths.length,
      skipped: candidatePaths.length - safePaths.length,
      details: removeError.message || JSON.stringify(removeError)
    };
  }

  return {
    removed: Array.isArray(data) ? data.length : 0,
    failed: 0,
    skipped: candidatePaths.length - safePaths.length,
    details: "Storage API accepted the deletion request."
  };
}

saveButton.addEventListener("click", async () => {
  if (isSaving) return;

  const total = savedPhotos.length + newFiles.length;
  if (total > MAX_PHOTOS) {
    showMessage("You can save a maximum of 15 photos.", false);
    return;
  }

  isSaving = true;
  saveButton.textContent = "Saving Photos...";
  updateCount();

  const uploadedPhotos = [];

  try {
    for (const file of newFiles) {
      uploadedPhotos.push(await uploadPhoto(file));
    }

    const finalPhotos = savedPhotos.concat(uploadedPhotos);
    const finalUrls = finalPhotos.map(photo => photo.url);

    const { data: updatedRows, error: updateError } = await client
      .from("libraries")
      .update({ photos: finalUrls })
      .eq("id", libraryId)
      .eq("owner_id", ownerId)
      .select("id, photos");

    if (updateError) throw new Error("Database update failed: " + updateError.message);

    if (!updatedRows || updatedRows.length !== 1) {
      throw new Error("Database did not confirm the update. Check table permissions and RLS.");
    }

    const savedUrls = Array.isArray(updatedRows[0].photos) ? updatedRows[0].photos : [];
    if (JSON.stringify(savedUrls) !== JSON.stringify(finalUrls)) {
      throw new Error("Database returned a different photo list. Storage files were not deleted.");
    }

    const finalUrlSet = new Set(finalUrls);
    const removedUrls = originalPhotoUrls.filter(url => !finalUrlSet.has(url));

    originalPhotoUrls = [...finalUrls];
    savedPhotos = finalPhotos;
    newFiles = [];
    photosChanged = false;
    renderPhotos();

    const cleanup = await removeUnreferencedStorageFiles(removedUrls);

    showMessage(
  "✓ Changes Saved Successfully. Your library photos have been updated.",
  true
);
  } catch (error) {
    console.error("Save photos error:", error);
    showMessage("Could not fully save photos: " + (error.message || "Unknown error"), false);
  } finally {
    isSaving = false;
    saveButton.textContent = "Save Changes";
    updateCount();
  }
});

loadLibrary();
</script>
</body>
</html>
