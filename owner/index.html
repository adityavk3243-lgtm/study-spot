<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StudySpot - Library Owner Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .hero {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-align: center;
      padding: 38px 18px 32px;
    }

    .logo {
      font-size: 58px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .brand {
      font-size: 35px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .portal-title {
      font-size: 21px;
      font-weight: 700;
      margin-top: 5px;
    }

    .tagline {
      margin: 9px auto 0;
      max-width: 330px;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.95;
    }

    .page {
      padding: 24px 16px 35px;
    }

    .container {
      width: 100%;
      max-width: 470px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 22px 16px 24px;
      box-shadow: 0 5px 22px rgba(0,0,0,0.09);
    }

    .library-illustration {
      height: 175px;
      border-radius: 18px;
      background: linear-gradient(
        180deg,
        #dff3ff 0%,
        #eef9ff 65%,
        #d8f0d2 65%,
        #c8e8bd 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .library-building {
      position: relative;
      width: 190px;
      height: 110px;
      background: #f59e0b;
      border-radius: 8px 8px 4px 4px;
      border: 4px solid #b45309;
      margin-top: 28px;
    }

    .library-roof {
      position: absolute;
      left: -15px;
      top: -42px;
      width: 212px;
      height: 65px;
      background: #dc2626;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .library-sign {
      position: absolute;
      top: 13px;
      left: 42px;
      right: 42px;
      background: white;
      border-radius: 4px;
      padding: 5px 2px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      color: #172033;
      z-index: 2;
    }

    .library-door {
      position: absolute;
      bottom: 0;
      left: 72px;
      width: 46px;
      height: 65px;
      background: #78350f;
      border-radius: 5px 5px 0 0;
    }

    .library-window {
      position: absolute;
      bottom: 27px;
      width: 30px;
      height: 30px;
      background: #bfdbfe;
      border: 3px solid #92400e;
      border-radius: 3px;
    }

    .window-left {
      left: 16px;
    }

    .window-right {
      right: 16px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.25;
    }

    .welcome p {
      margin: 8px 0 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 70px;
      padding: 12px 16px;
      margin-top: 12px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 700;
    }

    .register-button {
      background: #16a34a;
    }

    .login-button {
      background: #2563eb;
    }

    .button-left {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .button-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      flex-shrink: 0;
    }

    .button-title {
      font-size: 16px;
    }

    .button-subtitle {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.9;
    }

    .arrow {
      font-size: 26px;
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 22px;
    }

    @media (max-width: 380px) {
      .hero {
        padding: 32px 14px 28px;
      }

      .brand {
        font-size: 32px;
      }

      .portal-title {
        font-size: 19px;
      }

      .library-illustration {
        height: 160px;
      }

      .card {
        padding: 18px 14px 22px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">

    <div class="logo">
      📚
    </div>

    <div class="brand">
      StudySpot
    </div>

    <div class="portal-title">
      Library Owner Portal
    </div>

    <div class="tagline">
      Register your library and manage everything from one place.
    </div>

  </header>


  <main class="page">

    <div class="container">

      <div class="card">

        <div class="library-illustration">

          <div class="library-building">

            <div class="library-roof"></div>

            <div class="library-sign">
              LIBRARY
            </div>

            <div class="library-window window-left"></div>

            <div class="library-window window-right"></div>

            <div class="library-door"></div>

          </div>

        </div>


        <div class="welcome">

          <h1>
            Welcome, Library Owner
          </h1>

          <p>
            Choose an option below to get started.
          </p>

        </div>


        <a
          class="button register-button"
          href="owner.html"
        >

          <div class="button-left">

            <div class="button-icon">
              🏫
            </div>

            <div>

              <div class="button-title">
                Register Your Library
              </div>

              <div class="button-subtitle">
                List your library on StudySpot
              </div>

            </div>

          </div>

          <div class="arrow">
            ›
          </div>

        </a>


        <a
          class="button login-button"
          href="owner-login.html"
        >

          <div class="button-left">

            <div class="button-icon">
              🔐
            </div>

            <div>

              <div class="button-title">
                Login
              </div>

              <div class="button-subtitle">
                Access your account
              </div>

            </div>

          </div>

          <div class="arrow">
            ›
          </div>

        </a>

      </div>


      <div class="footer">
        © 2026 StudySpot<br>
        Library Owner Portal
      </div>

    </div>

  </main>

</body>
</html>
