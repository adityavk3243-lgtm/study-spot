<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 28px 22px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.09);
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand .icon {
      font-size: 40px;
    }

    .brand h1 {
      color: #2563eb;
      margin: 8px 0;
      font-size: 28px;
    }

    .brand p {
      color: #64748b;
      margin: 0;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .main-button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      padding: 14px;
      text-align: center;
      border-radius: 10px;
      background: #e2e8f0;
      color: #1e293b;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main class="card">

    <header class="brand">
      <div class="icon">📚</div>
      <h1>StudySpot</h1>
      <p>Library Owner Account Recovery</p>
    </header>

    <h2>Create New Password</h2>

    <p class="description">
      Create a new password for your StudySpot owner account.
    </p>

    <form id="passwordForm" class="hidden">

      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm New Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Re-enter new password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button type="submit" class="main-button" id="resetButton">
        Reset Password
      </button>

    </form>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
    ></div>

    <a class="back-link" href="owner-login.html">
      ← Back to Owner Login
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <script>
    const form = document.getElementById("passwordForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const resetButton = document.getElementById("resetButton");
    const message = document.getElementById("message");

    let recoveryVerified = false;
    let passwordUpdateInProgress = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    async function initializeRecovery() {
      const client = window.supabaseClient;

      if (!client) {
        showMessage(
          "The recovery service is temporarily unavailable. Please try again later.",
          "error"
        );
        return;
      }

      try {
        const url = new URL(window.location.href);
        const hashParams = new URLSearchParams(
          url.hash.replace(/^#/, "")
        );

        const queryParams = url.searchParams;

        if (
          hashParams.get("error") ||
          queryParams.get("error")
        ) {
          showMessage(
            "This reset link is invalid or has expired. Please request a new link.",
            "error"
          );
          return;
        }

        const code = queryParams.get("code");

        if (code) {
          const { error } = await client.auth.exchangeCodeForSession(code);

          if (error) throw error;

          url.searchParams.delete("code");
          window.history.replaceState({}, document.title, url.pathname + url.search);
        } else if (hashParams.get("access_token") && hashParams.get("refresh_token")) {
          const { error } = await client.auth.setSession({
            access_token: hashParams.get("access_token"),
            refresh_token: hashParams.get("refresh_token")
          });

          if (error) throw error;

          window.history.replaceState({}, document.title, url.pathname);
        } else if (hashParams.get("type") === "recovery") {
          const { error } = await client.auth.getSession();

          if (error) throw error;
        }

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          showMessage(
            "This reset link is invalid, expired, or already used. Please request a new link.",
            "error"
          );
          return;
        }

        recoveryVerified = true;
        form.classList.remove("hidden");

        showMessage(
          "Verification successful. You can now create a new password.",
          "success"
        );

      } catch (error) {
        console.error("Recovery initialization failed:", error);

        showMessage(
          "We could not verify this reset link. Please request a new one.",
          "error"
        );
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!recoveryVerified || passwordUpdateInProgress) {
        showMessage(
          "Please open a valid password reset link before continuing.",
          "error"
        );
        return;
      }

      if (newPassword.value.length < 6) {
        showMessage(
          "Your new password must contain at least 6 characters.",
          "error"
        );
        return;
      }

      if (newPassword.value !== confirmPassword.value) {
        showMessage(
          "The passwords do not match. Please try again.",
          "error"
        );
        confirmPassword.focus();
        return;
      }

      passwordUpdateInProgress = true;
      resetButton.disabled = true;
      resetButton.textContent = "Updating Password...";

      try {
        const { error } = await window.supabaseClient.auth.updateUser({
          password: newPassword.value
        });

        if (error) throw error;

        recoveryVerified = false;
        form.reset();
        form.classList.add("hidden");

        showMessage(
          "Your password has been updated successfully. You can now log in with your new password.",
          "success"
        );

      } catch (error) {
        console.error("Password update failed:", error);

        showMessage(
          "We could not update your password. Please request a new reset link and try again.",
          "error"
        );

      } finally {
        passwordUpdateInProgress = false;
        resetButton.disabled = false;
        resetButton.textContent = "Reset Password";
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
