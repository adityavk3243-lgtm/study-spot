
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Library - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 15px;
    }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #2563eb;
      margin-top: 0;
      font-size: 22px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    .facility {
      margin-top: 12px;
      font-weight: normal;
    }

    .update-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .update-button:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
    }

    .photo-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .photo-preview img {
      width: 95px;
      height: 95px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }

    .location-box {
      padding: 12px;
      background: #eff6ff;
      border-radius: 8px;
      margin-top: 12px;
      color: #1e40af;
      word-break: break-word;
    }

    .back-button {
      display: block;
      text-align: center;
      margin: 20px 0;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>

<body>
  <header>
    <h1>📚 StudySpot</h1>
    <p>Edit Library Information</p>
  </header>

  <div class="container">

    <!-- Library Details -->
    <div class="section">
      <h2>1. Library Details</h2>

      <label for="libraryName">Library Name</label>
      <input type="text" id="libraryName" placeholder="Enter library name">

      <label for="ownerName">Owner Name</label>
      <input type="text" id="ownerName" placeholder="Enter owner name">

      <label for="mobileNumber">Mobile Number</label>
      <input type="tel" id="mobileNumber" placeholder="Enter mobile number">

      <label for="address">Complete Address</label>
      <textarea id="address" placeholder="Enter complete library address"></textarea>

      <label for="city">City</label>
      <input type="text" id="city" placeholder="Enter city">

      <button class="update-button" type="button" onclick="updateDetails()">
        Update Library Details
      </button>

      <div class="message" id="detailsMessage"></div>
    </div>

    <!-- Price and Facilities -->
    <div class="section">
      <h2>2. Price and Facilities</h2>

      <label for="monthlyFee">Monthly Fee</label>
      <input type="number" id="monthlyFee" placeholder="Enter monthly fee in rupees">

      <label class="facility">
        <input type="checkbox" id="wifi"> Wi-Fi
      </label>

      <label class="facility">
        <input type="checkbox" id="ac"> Air Conditioning
      </label>

      <label class="facility">
        <input type="checkbox" id="cctv"> CCTV
      </label>

      <label class="facility">
        <input type="checkbox" id="powerBackup"> Power Backup
      </label>

      <label class="facility">
        <input type="checkbox" id="silentZone"> Silent Zone
      </label>

      <label for="otherFacilities">Other Facilities</label>
      <textarea id="otherFacilities" placeholder="Enter other facilities"></textarea>

      <button class="update-button" type="button" onclick="updateFacilities()">
        Update Price and Facilities
      </button>

      <div class="message" id="facilitiesMessage"></div>
    </div>

    <!-- Library Photos -->
    <div class="section">
      <h2>3. Library Photos</h2>

      <label for="libraryPhotos">Select Library Photos</label>
      <input type="file" id="libraryPhotos" accept="image/*" multiple>

      <div class="photo-preview" id="photoPreview"></div>

      <button class="update-button" type="button" onclick="updatePhotos()">
        Update Library Photos
      </button>

      <div class="message" id="photosMessage"></div>
    </div>

    <!-- Opening Hours -->
    <div class="section">
      <h2>4. Opening Hours</h2>

      <label for="openingTime">Opening Time</label>
      <input type="time" id="openingTime">

      <label for="closingTime">Closing Time</label>
      <input type="time" id="closingTime">

      <button class="update-button" type="button" onclick="updateHours()">
        Update Opening Hours
      </button>

      <div class="message" id="hoursMessage"></div>
    </div>

    <!-- Library Location -->
    <div class="section">
      <h2>5. Library Location</h2>

      <p>Use this button to update the exact location of your library.</p>

      <button class="update-button" type="button" onclick="updateLocation()">
        📍 Update Library Location
      </button>

      <div class="location-box" id="locationResult">
        Location has not been updated yet.
      </div>

      <div class="message" id="locationMessage"></div>
    </div>

    <a class="back-button" href="owner-dashboard.html">
      ← Back to Owner Dashboard
    </a>
  </div>

  

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const client = window.supabaseClient;

  if (!client) {
    alert("Supabase connection not found.");
    return;
  }

  const {
    data: { user },
    error: userError
  } = await client.auth.getUser();

  if (userError || !user) {
    alert("Please log in first to view your library details.");
    return;
  }

  const { data: library, error: libraryError } = await client
    .from("libraries")
    .select("*")
    .eq("owner_id", user.id)
    .maybeSingle();

  if (libraryError) {
    alert("Unable to load library details: " + libraryError.message);
    return;
  }

  if (!library) {
    alert("No registered library found for this account.");
    return;
  }

  document.getElementById("libraryName").value = library.library_name || "";
  document.getElementById("ownerName").value = library.owner_name || "";
  document.getElementById("mobileNumber").value = library.mobile || "";
  document.getElementById("address").value = library.address || "";
  document.getElementById("city").value = library.city || "";

  document.getElementById("monthlyFee").value = library.monthly_fee || "";

  document.getElementById("wifi").checked =
    (library.facilities || []).includes("Wi-Fi");

  document.getElementById("ac").checked =
    (library.facilities || []).includes("Air Conditioning");

  document.getElementById("cctv").checked =
    (library.facilities || []).includes("CCTV");

  document.getElementById("powerBackup").checked =
    (library.facilities || []).includes("Power Backup");

  document.getElementById("silentZone").checked =
    (library.facilities || []).includes("Silent Zone");

  document.getElementById("otherFacilities").value =
    library.other_facilities || "";

  document.getElementById("openingTime").value =
    library.opening_time || "";

  document.getElementById("closingTime").value =
    library.closing_time || "";
});
</script>


</body>
</html>
