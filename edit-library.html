<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Library Details - StudySpot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #2563eb;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 StudySpot</h1>
    <p>Edit Library Details</p>
  </header>

  <div class="container">
    <div class="box">
      <h2>Library Information</h2>

      <form id="libraryForm">
        <label for="libraryName">Library Name</label>
        <input
          type="text"
          id="libraryName"
          placeholder="Enter library name"
          required
        >

        <label for="ownerName">Owner Name</label>
        <input
          type="text"
          id="ownerName"
          placeholder="Enter owner name"
          required
        >

        <label for="mobileNumber">Mobile Number</label>
        <input
          type="tel"
          id="mobileNumber"
          placeholder="Enter mobile number"
          required
        >

        <label for="address">Complete Address</label>
        <textarea
          id="address"
          placeholder="Enter complete library address"
          required
        ></textarea>

        <label for="city">City</label>
        <input
          type="text"
          id="city"
          placeholder="Enter city"
          required
        >

        <label for="monthlyFee">Monthly Fee</label>
        <input
          type="number"
          id="monthlyFee"
          placeholder="Enter monthly fee in rupees"
          required
        >

        <label for="facilities">Facilities</label>
        <textarea
          id="facilities"
          placeholder="Example: Wi-Fi, AC, CCTV, Power Backup, Silent Zone"
        ></textarea>

        <label for="openingTime">Opening Time</label>
        <input type="time" id="openingTime">

        <label for="closingTime">Closing Time</label>
        <input type="time" id="closingTime">

        <button type="submit" class="save-button">
          Save Updated Details
        </button>

        <div class="message" id="message">
          Library details updated successfully in this demo.
        </div>
      </form>

      <a class="back-button" href="owner-dashboard.html">
        ← Back to Dashboard
      </a>
    </div>
  </div>

  <script>
    const libraryForm = document.getElementById("libraryForm");
    const message = document.getElementById("message");

    libraryForm.addEventListener("submit", function(event) {
      event.preventDefault();

      message.style.display = "block";
      message.textContent =
        "Library details updated successfully in this demo.";
    });
  </script>
</body>
</html>
